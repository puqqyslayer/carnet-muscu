<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Carnet">
<meta name="theme-color" content="#000000">
<title>Carnet muscu</title>
<style>
:root{
  --iron:#000; --slab:#1c1c1e; --slab2:#2c2c2e; --line:#3a3a3c;
  --chalk:#f5f5f7; --dust:#8e8e93;
  --blue:#0a84ff; --red:#ff453a; --yellow:#ffd60a; --green:#30d158; --orange:#ff9f0a;
  --r-lg:20px; --r-sm:12px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--iron);color:var(--chalk);
  font-family:system-ui,-apple-system,"SF Pro Text","Segoe UI",Roboto,sans-serif;
  font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.num{font-variant-numeric:tabular-nums}
#app{max-width:560px;margin:0 auto;padding:16px 16px 110px}
h1{font-size:28px;line-height:1.15;margin:8px 0 4px;font-weight:800;letter-spacing:-.01em}
h2{font-size:19px;margin:22px 0 10px;font-weight:750}
h3{font-size:16px;margin:0 0 4px;font-weight:700}
p{margin:0 0 8px}
.muted{color:var(--dust)}
.small{font-size:13.5px}
.box{background:var(--slab);border-radius:var(--r-lg);padding:14px 16px;margin-bottom:12px}
.row{display:flex;align-items:center;gap:10px}
.row.between{justify-content:space-between}
.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
button{font:inherit;color:inherit;border:0;background:var(--slab2);border-radius:var(--r-sm);padding:10px 14px;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--yellow);outline-offset:2px}
button.primary{background:var(--blue);font-weight:750;color:#fff}
button.big{width:100%;padding:16px;font-size:18px;border-radius:14px}
button.ghost{background:transparent;border:1.5px solid var(--line)}
button.danger{background:transparent;border:1.5px solid var(--red);color:var(--red)}
button.sm{padding:6px 10px;font-size:14px}
button:disabled{opacity:.45}
input,select,textarea{font:inherit;color:var(--chalk);background:var(--iron);border:1.5px solid var(--line);border-radius:var(--r-sm);padding:10px 12px;width:100%}
textarea{min-height:70px;resize:vertical}
label.f{display:block;margin:10px 0 4px;color:var(--dust);font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:6px 11px;border-radius:999px;background:var(--slab2);font-size:14px;border:1.5px solid transparent}
.chip.on{border-color:var(--blue);background:rgba(61,123,224,.18)}
.tag{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12.5px;font-weight:750;background:var(--slab2);white-space:nowrap}
.tag.p{background:rgba(61,123,224,.2);color:#b9d0f7;font-weight:650}.tag.s{background:transparent;border:1px solid var(--line);color:var(--dust);font-weight:600}
.bar{height:10px;background:var(--iron);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--green);border-radius:99px}
.list-item{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.list-item:last-child{border-bottom:0}
button.list-item{width:100%;background:none;border-radius:0;text-align:left;padding:11px 0}
.kpi{font-size:24px;font-weight:800}
.stat{background:var(--slab);border-radius:14px;padding:10px 12px}
.box .stat{background:var(--iron)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(96px + env(safe-area-inset-bottom,0px));background:var(--chalk);color:var(--iron);padding:10px 16px;border-radius:12px;font-weight:650;z-index:60;max-width:90vw}
/* hub : la série */
.streak{display:flex;align-items:center;gap:16px}
.streak .flame{font-size:52px;line-height:1}
.streak .n{font-size:54px;font-weight:850;line-height:1;letter-spacing:-.02em}
.streak.cold .flame{filter:grayscale(1);opacity:.5}
/* nav */
nav#nav{position:fixed;left:0;right:0;bottom:0;background:rgba(29,34,41,.96);border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:space-around;z-index:40;backdrop-filter:blur(10px)}
nav#nav button{background:none;padding:4px 2px;display:flex;flex-direction:column;align-items:center;font-size:11px;color:var(--dust);gap:1px;flex:1}
nav#nav button b{font-size:20px;font-weight:400;line-height:1.2}
nav#nav button.on{color:var(--chalk)}
/* modal */
#modal{position:fixed;inset:0;z-index:50;display:none;background:rgba(0,0,0,.55)}
#modal.open{display:flex;align-items:flex-end;justify-content:center}
#modal .sheet{background:var(--slab);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:22px 22px 0 0;
  padding:18px 16px calc(24px + env(safe-area-inset-bottom,0px))}
/* séance */
.sesshead{position:sticky;top:0;z-index:5;background:var(--iron);padding:6px 0 4px;margin-top:-6px}
.chrono{font-size:22px;font-weight:850}
.steps{display:flex;gap:4px;margin:8px 0 14px}
.steps i{flex:1;height:5px;border-radius:5px;background:var(--slab2)}
.steps i.done{background:var(--green)}.steps i.cur{background:var(--blue)}
.target{font-size:30px;font-weight:850;letter-spacing:-.01em;margin:4px 0}
.stepper{display:flex;align-items:stretch;gap:6px}
.stepper button{width:54px;font-size:22px;font-weight:700;padding:0}
.stepper input{text-align:center;font-size:24px;font-weight:800;padding:10px 4px}
.opts{display:grid;gap:6px}
.opts.c4{grid-template-columns:repeat(4,1fr)}.opts.c3{grid-template-columns:repeat(3,1fr)}
.opt{padding:9px 2px;font-size:13px;display:flex;flex-direction:column;align-items:center;gap:1px;border:1.5px solid transparent}
.opt span{font-size:19px}
.opt.on{border-color:var(--chalk);background:var(--iron)}
.opt.facile.on{border-color:var(--green)}.opt.correct.on{border-color:var(--blue)}.opt.dur.on{border-color:var(--yellow)}.opt.echec.on{border-color:var(--red)}
.opt.propre.on{border-color:var(--green)}.opt.moyen.on{border-color:var(--yellow)}.opt.arrache.on{border-color:var(--red)}
.setrow{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px dashed var(--line);font-size:15px}
.note{border-left:4px solid var(--blue);padding:8px 12px;background:var(--iron);border-radius:0 10px 10px 0;font-size:14px;margin:8px 0}
.note.down{border-color:var(--red)}.note.up{border-color:var(--green)}.note.hold,.note.stag{border-color:var(--yellow)}
.stretch{display:flex;gap:12px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--line)}
.stretch:last-child{border-bottom:0}
.serow{display:flex;align-items:center;gap:6px;margin-top:8px}
.serow input{flex:1;min-width:0;padding:8px}
.serow select{width:auto;padding:8px 4px}
.stretch.done h3{text-decoration:line-through;color:var(--dust)}
/* minuteur de repos : le disque */
#timer{position:fixed;inset:0;z-index:45;background:rgba(20,24,29,.97);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;text-align:center}
.plate{position:relative;width:min(74vw,300px);aspect-ratio:1}
.plate svg{width:100%;height:100%;transform:rotate(-90deg)}
.plate .t{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.plate .t b{font-size:64px;font-weight:850;line-height:1}
/* calendrier */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center}
.cal .h{font-size:12px;color:var(--dust);padding-bottom:2px}
.cal .d{aspect-ratio:1;border-radius:10px;background:var(--iron);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:14px;padding:0;border:1.5px solid transparent}
.cal .d.out{visibility:hidden}
.cal .d.plan{border:1.5px dashed var(--line)}
.cal .d.today{border:1.5px solid var(--chalk)}
.cal .d.done{font-weight:750}
.cal .d.miss{color:var(--red)}
.cal .d small{font-size:10px;line-height:1}
.wk{display:flex;align-items:flex-end;gap:6px;height:90px}
.wk div{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;color:var(--dust)}
.wk div i{display:block;width:100%;border-radius:6px 6px 3px 3px;background:var(--slab2)}
.wk div i.ok{background:var(--green)}.wk div i.part{background:var(--yellow)}
.mus{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:15px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:8px;vertical-align:middle}
.swatch{width:32px;height:32px;border-radius:50%;padding:0;border:3px solid transparent}
.swatch.on{border-color:var(--chalk)}
svg text{fill:var(--dust);font-size:10px;font-family:inherit}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
/* ===== style openGym ===== */
button.primary{background:var(--green);color:#03170a;font-weight:800}
.chip.on{border-color:var(--green);background:rgba(48,209,88,.14)}
svg.ic{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav#nav{background:rgba(18,18,20,.94);border-top:0;border-radius:26px 26px 0 0;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));align-items:flex-end}
nav#nav button{font-size:11px;gap:3px}
nav#nav button.on{color:var(--green)}
nav#nav .fab{flex:0 0 auto;margin-top:-30px;display:flex;flex-direction:column;align-items:center;gap:3px;color:var(--green);font-weight:700}
nav#nav .fab span{width:62px;height:62px;border-radius:50%;background:var(--green);color:#03170a;display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 6px #000}
nav#nav .fab.live{color:var(--orange)}nav#nav .fab.live span{background:var(--orange)}
nav#nav .fab svg.ic{width:28px;height:28px;stroke-width:2.4}
.toprow{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.rbtn{width:42px;height:42px;border-radius:50%;padding:0;display:inline-flex;align-items:center;justify-content:center;background:var(--slab2);font-size:19px;font-weight:700;flex:0 0 auto}
.rbtn.ok{color:var(--green)}.rbtn.sm{width:34px;height:34px;font-size:16px}
.week{display:grid;grid-template-columns:repeat(7,1fr);text-align:center;gap:2px}
.week button{background:none;padding:4px 0;display:flex;flex-direction:column;align-items:center;gap:4px}
.week small{font-size:11px;color:var(--dust);letter-spacing:.05em}
.week b{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:600}
.week .today b{background:var(--green);color:#03170a;font-weight:800}
.week i{width:5px;height:5px;border-radius:50%;background:transparent}.week i.on{background:var(--green)}
.livebar{display:flex;align-items:center;gap:12px;background:rgba(255,159,10,.14);border:1px solid rgba(255,159,10,.45);border-radius:16px;padding:12px 14px;margin:10px 0;width:100%;text-align:left}
/* séance guidée */
.hud-top{display:flex;align-items:center;justify-content:space-between;gap:8px;position:sticky;top:0;z-index:5;background:var(--iron);padding:6px 0}
.hud-title{text-align:center;display:flex;flex-direction:column;line-height:1.3;min-width:0}
.hud-title b{font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pbar{height:4px;background:var(--slab2);border-radius:4px;margin:6px 0 14px;overflow:hidden}.pbar i{display:block;height:100%;background:var(--green);border-radius:4px}
.media{background:#fff;border-radius:22px;overflow:hidden;position:relative;aspect-ratio:4/3;display:flex;align-items:center;justify-content:center;margin-top:8px}
.media img,.media video{width:100%;height:100%;object-fit:contain;display:block}
.media .mbar{position:absolute;left:10px;right:10px;bottom:10px;display:flex;justify-content:space-between;gap:6px}
.media .mbar button{background:rgba(60,60,67,.78);color:#fff;font-size:13px;padding:5px 11px;border-radius:999px}
.media .mbar button.on{background:rgba(20,20,22,.92)}
button.media-empty{width:100%;margin-top:8px;background:transparent;border:1.5px dashed var(--line);border-radius:18px;padding:14px;color:var(--dust);font-size:14px}
.exname{font-size:25px;font-weight:850;margin:0;letter-spacing:-.01em}
.prog{color:var(--green);font-size:14.5px;margin:6px 0 0}.prog b{font-weight:800}
.prog.down{color:var(--red)}.prog.hold,.prog.stag{color:var(--yellow)}
.stable{background:var(--slab);border-radius:22px;padding:10px 10px 8px;margin-top:12px}
.shead,.srow{display:grid;grid-template-columns:22px 1fr 1fr 44px 36px;gap:6px;align-items:center}
.shead{font-size:11px;color:var(--dust);text-align:center;padding:2px 0 6px;letter-spacing:.06em}
.srow{padding:4px 0}
.sn{width:22px;height:22px;border-radius:50%;background:var(--slab2);font-size:12px;display:flex;align-items:center;justify-content:center;color:var(--dust)}
.srow.done .sn{background:var(--green);color:#03170a;font-weight:800}
.stp{display:flex;align-items:center;background:var(--slab2);border-radius:12px;height:44px;min-width:0}
.stp button{background:none;width:28px;height:44px;padding:0;font-size:19px;color:var(--chalk);flex:0 0 auto}
.stp input{background:none;border:0;text-align:center;padding:0;font-size:17px;font-weight:750;min-width:0;width:100%;flex:1}
.stp.ro{justify-content:center;font-weight:750;font-size:17px;background:transparent}
.srow.next .stp{box-shadow:inset 0 0 0 1.5px rgba(48,209,88,.55)}
.feel{height:44px;padding:0;border-radius:12px;font-size:15px;letter-spacing:-2px}
.chk{width:34px;height:34px;border-radius:50%;padding:0;background:none;border:2px solid #48484a;justify-self:center}
.srow.next .chk{border-color:var(--green)}
.srow.done .chk{background:var(--green);border-color:var(--green);color:#03170a;font-weight:900;font-size:16px}
.mcar{display:flex;width:100%;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch;overscroll-behavior-x:contain}
.mcar::-webkit-scrollbar{display:none}
.mslide{flex:0 0 100%;width:100%;height:100%;scroll-snap-align:center;scroll-snap-stop:always;position:relative;display:flex;align-items:center;justify-content:center}
.mslide img,.mslide video{width:100%;height:100%;object-fit:contain;display:block}
.mlabel{position:absolute;top:10px;left:10px;background:rgba(60,60,67,.78);color:#fff;font-size:12.5px;padding:3px 10px;border-radius:999px}
.media .mbar{pointer-events:none}.media .mbar>*{pointer-events:auto}
.mdots{display:flex;gap:6px;align-items:center;background:rgba(60,60,67,.6);padding:7px 10px;border-radius:999px;pointer-events:none!important}
.mdots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.45)}.mdots i.on{background:#fff}
.tips{display:flex;gap:8px;align-items:flex-start;color:var(--dust);font-size:13.5px;line-height:1.45;white-space:pre-line;margin:8px 0 0;padding:8px 10px;background:var(--slab);border-radius:12px}
.tipedit{background:none;padding:0 2px;font-size:14px;opacity:.7;flex:0 0 auto}
.tipadd{background:none;padding:6px 0 0;color:var(--dust);font-size:13.5px;text-align:left}
.legend{font-size:12.5px;line-height:1.35;color:var(--dust);display:flex;flex-direction:column;gap:5px;margin-top:6px}
.legend>div{display:grid;grid-template-columns:22px 1fr;gap:4px;align-items:start;padding:2px 4px;border-radius:8px}
.legend b{color:var(--chalk);font-weight:700}
.legend>div.on{background:rgba(48,209,88,.12)}
.legend .sep{height:1px;background:var(--line);margin:3px 0;padding:0}
</style>
</head>
<body>
<div id="app"></div>
<nav id="nav"></nav>
<div id="modal"><div class="sheet" id="sheet"></div></div>
<input type="file" id="importFile" accept=".json,application/json" hidden>
<input type="file" id="mediaFile" hidden>
<script>
'use strict';
/* ========= constantes ========= */
const KEY='carnetMuscu.v1';
const MUSCLES=['Pectoraux','Grand dorsal','Haut du dos / trapèzes','Épaules avant','Épaules latérales','Épaules arrière','Biceps','Triceps','Avant-bras','Quadriceps','Ischio-jambiers','Fessiers','Adducteurs','Mollets','Abdominaux','Obliques','Lombaires'];
const DAYS=['Lun','Mar','Mer','Jeu','Ven','Sam','Dim'];
const DIFF=[['facile','Facile','😌','Toutes les reps à la même vitesse : tu aurais pu continuer longtemps.'],
  ['correct','Correct','🙂','Les 2 dernières reps ralentissent, mais restent propres. C’est la zone à viser.'],
  ['dur','Dur','😤','Dernière rep lente : pas sûr d’en réussir une de plus, propre.'],
  ['echec','Échec','💀','Tu n’as pas pu finir une rep propre.']];
const DIFF_RESERVE={facile:4,correct:2,dur:1,echec:0}; // reps restantes estimées, utilisées par le calculateur
const EXEC=[['propre','Propre','✅','Mouvement contrôlé, amplitude complète, sans élan.'],['moyen','Moyenne','⚠️','Petit élan ou amplitude un peu réduite sur les dernières reps.'],['arrache','À l’arrache','❌','Élan, rebond ou dos qui décolle : la charge ne montera pas.']];
function feelLegend(sel){
  return `<div class="legend">${DIFF.map(d=>`<div class="${sel&&sel.diff===d[0]?'on':''}"><span>${d[2]}</span><span><b>${d[1]}</b> · ${esc(d[3])}</span></div>`).join('')}
  <div class="sep"></div>${EXEC.map(d=>`<div class="${sel&&sel.exec===d[0]?'on':''}"><span>${d[2]}</span><span><b>${d[1]}</b> · ${esc(d[3])}</span></div>`).join('')}</div>`;
}
const DIFFV={facile:1,correct:2,dur:3,echec:4};
const PALETTE=['#3d7be0','#f2c230','#3fb56b','#e0473b','#a86be0','#2fb8b0','#e08a3b'];
// muscle : [nom, comment faire, secondes, par côté]
const STRETCH={
  'Pectoraux':['Pecs au montant de porte','Avant-bras contre le montant, coude à hauteur d’épaule, avance doucement le buste.',30,true],
  'Grand dorsal':['Posture de l’enfant bras tendus','À genoux, fesses vers les talons, bras loin devant, pousse les mains vers l’avant.',30,false],
  'Haut du dos / trapèzes':['Enroulement du haut du dos','Mains jointes bras tendus devant toi, arrondis le dos et écarte les omoplates.',30,false],
  'Épaules avant':['Ouverture de poitrine','Mains jointes dans le dos, bras tendus, remonte-les doucement en ouvrant la poitrine.',30,false],
  'Épaules latérales':['Bras croisé devant la poitrine','Ramène le bras tendu contre la poitrine avec l’autre main, épaule basse.',30,true],
  'Épaules arrière':['Bras croisé devant la poitrine','Ramène le bras tendu contre la poitrine avec l’autre main, épaule basse.',30,true],
  'Biceps':['Biceps au mur','Paume à plat contre un mur derrière toi, bras tendu, tourne doucement le buste à l’opposé.',30,true],
  'Triceps':['Coude derrière la tête','Main dans le dos, tire doucement le coude avec l’autre main.',30,true],
  'Avant-bras':['Poignets et avant-bras','Bras tendu, tire doucement les doigts vers toi, paume vers le haut puis vers le bas. Sans forcer.',20,true],
  'Quadriceps':['Talon vers la fesse','Debout, attrape ta cheville, genoux serrés, bassin légèrement vers l’avant.',30,true],
  'Ischio-jambiers':['Jambe tendue sur un banc','Talon sur le banc, dos droit, penche le buste vers l’avant à partir des hanches.',30,true],
  'Fessiers':['Figure 4 allongé','Sur le dos, cheville sur le genou opposé, ramène les deux jambes vers toi.',30,true],
  'Adducteurs':['Papillon assis','Plantes de pieds collées, dos droit, laisse descendre les genoux.',30,false],
  'Mollets':['Mollet contre le mur','Mains au mur, jambe arrière tendue, talon au sol, avance le bassin.',30,true],
  'Abdominaux':['Cobra doux','À plat ventre, pousse sur les mains pour relever le buste, bassin au sol.',20,false],
  'Obliques':['Inclinaison latérale','Debout, bras au-dessus de la tête, penche-toi sur le côté.',20,true],
  'Lombaires':['Genoux à la poitrine','Sur le dos, ramène les deux genoux contre la poitrine et respire.',30,false],
};

/* ========= utilitaires ========= */
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,8);

function suggest(ex){
  const n=ex.sets,lo=ex.repMin,hi=ex.repMax;
  const base=r=>Array.from({length:n},()=>r);
  const pad=a=>Array.from({length:n},(_,i)=>a[i]!=null?a[i]:a[a.length-1]);
  const P=perfs(ex.id);const last=P[P.length-1]||null;
  if(ex.forceW!=null)return {w:ex.forceW,reps:base(lo),msg:'Poids calculé dans Outils (poids optimal).',tag:'up',last};
  if(!last){
    if(ex.swapFrom&&ex.swapFrom.w!=null)return {w:ex.swapFrom.w,reps:base(lo),msg:`Départ estimé depuis ${ex.swapFrom.name} (marge de 20 %, les machines diffèrent). Ajuste dès la 1re série si besoin.`,tag:'hold',last};
    if(ex.startWeight!=null)return {w:ex.startWeight,reps:base(lo),msg:'Poids de départ enregistré pour cet exo.',tag:'hold',last};
    return {w:null,reps:base(lo),msg:'Pas encore d’historique. Trouve ton poids dans Outils, ou commence léger.',tag:'hold',last};
  }
  // charge de référence = celle de la dernière série (gère le calibrage et les baisses en cours de séance)
  const s=last.sets,w=refW(s),reps=coreSets(s).filter(x=>x.w===w).map(x=>x.r);
  const sum=x=>x.sets.reduce((t,y)=>t+y.r,0);
  const drop=reps[0]-reps[reps.length-1],minR=Math.min(...reps);
  const arr=s.some(x=>x.exec==='arrache'),fail=s.some(x=>x.diff==='echec'&&!x.test);
  const easy=s.filter(x=>x.diff==='facile').length>s.length/2;
  const atW=s.filter(x=>x.w===w),allTop=atW.length>=n&&atW.every(x=>x.r>=hi);
  // 1. trop lourd : on baisse
  if(drop>=3||minR<=lo-2){const nw=roundDown(w*0.925,ex.inc);return {w:nw,reps:base(lo),msg:`Trop lourd la dernière fois (${reps.join('-')}). On baisse de 7,5 % et on repart à ${lo} reps.`,tag:'down',last}}
  // progression linéaire : objectif fixe (minimum de la fourchette), +1 palier à chaque séance réussie
  if(ex.prog==='lin'){
    const okSets=s.filter(x=>x.w===w&&!x.test),ok=s.filter(x=>x.w===w).length>=n&&okSets.every(x=>x.r>=lo);
    if(ok&&!arr&&!fail){const over=reps.filter(r=>r>=lo+3).length>reps.length/2,k=(over||easy)?2:1;
      return {w:w+ex.inc*k,reps:base(lo),msg:`Linéaire : toutes les séries réussies${over?' avec de la marge':easy?' facilement':''}, +${fmt(ex.inc*k)} kg.`,tag:'up',last}}
    let fails=0;for(let i=P.length-1;i>=0&&refW(P[i].sets)===w;i--){const c=P[i].sets.filter(x=>x.w===w&&!x.test);if(c.some(x=>x.r<lo))fails++;else break}
    if(fails>=3){const nw=roundDown(w*0.9,ex.inc);return {w:nw,reps:base(lo),msg:`Linéaire : 3 séances sans réussir ${lo} reps à ${fmt(w)} kg. On baisse de 10 % pour relancer. Si ça rebloque, passe cet exo en double progression.`,tag:'down',last}}
    return {w,reps:base(lo),msg:arr?'Linéaire : exécution à l’arrache, on refait la même charge proprement.':fail?'Linéaire : échec la dernière fois, même charge.':`Linéaire : même charge, vise ${lo} reps sur toutes les séries${fails?` (essai ${fails+1} sur 3)`:''}.`,tag:'hold',last};
  }
  // 2. haut de fourchette atteint : on monte (2 paliers si max dépassé de 3 reps ou plus, ou si c'était facile)
  const testOver=s.some(x=>x.test&&x.r>=hi+3);
  if((allTop||testOver)&&!arr&&!fail){
    const over=reps.filter(r=>r>=hi+3).length>reps.length/2,k=(over||easy)?2:1;
    const why=!allTop?`Ta série à l’échec (${s.find(x=>x.test).r} reps) montre que la charge est trop légère`:over?`Tu as dépassé le maximum (${reps.join('-')} pour ${hi} max)`:easy?'Haut de fourchette atteint facilement':'Haut de fourchette atteint';
    return {w:w+ex.inc*k,reps:base(lo),msg:`${why} : +${fmt(ex.inc*k)} kg, retour à ${lo} reps.`,tag:'up',last}}
  if(arr)return {w,reps:pad(reps.map(r=>clamp(r,lo,hi))),msg:'Exécution à l’arrache la dernière fois : même charge, mêmes reps, soigne la technique.',tag:'hold',last};
  if(fail)return {w,reps:pad(reps.map(r=>clamp(r,lo,hi))),msg:'Échec la dernière fois : on vise les mêmes reps avant d’en ajouter.',tag:'hold',last};
  // 3. stagnation (règle du guide en 2 étapes), sur les séances d'affilée au même poids
  const run=[];for(let i=P.length-1;i>=0&&refW(P[i].sets)===w;i--)run.unshift(P[i]);
  let stag=-1;for(let j=2;j<run.length;j++){if(sum(run[j])<=sum(run[j-2])){stag=j;break}}
  if(stag===run.length-1)return {w,reps:base(lo),msg:'Stagnation sur 3 séances : même poids, on repart du minimum de reps (étape 1).',tag:'stag',last};
  if(stag>=0){
    const preBest=Math.max(...run.slice(0,stag+1).map(sum)),post=run.slice(stag+1);
    if(post.length>=3&&sum(last)<=preBest){
      const before=P[P.length-run.length-1];
      const pw=before&&refW(before.sets)<w?refW(before.sets):roundDown(w-ex.inc,ex.inc);
      return {w:pw,reps:base(lo),msg:`Toujours bloqué après être reparti du minimum : retour au poids précédent (${fmt(pw)} kg) pour relancer la progression (étape 2).`,tag:'down',last};
    }
  }
  // 4. sinon : +1 rep par série
  return {w,reps:pad(reps.map(r=>clamp(r+1,lo,hi))),msg:'+1 rep par série par rapport à la dernière fois.',tag:'plus',last};
}
function sessionStats(s){
  let sets=0,vol=0,prop=0,dsum=0;const P={},Sd={};
  s.exos.forEach(e=>{const n=e.sets.length;e.sets.forEach(x=>{sets++;vol+=x.w*x.r;if(x.exec==='propre')prop++;dsum+=DIFFV[x.diff]||2});
    (e.primary||[]).forEach(m=>P[m]=(P[m]||0)+n);(e.secondary||[]).forEach(m=>Sd[m]=(Sd[m]||0)+n)});
  return {sets,vol,execPct:sets?Math.round(prop/sets*100):0,diff:sets?dsum/sets:0,dur:(s.end&&s.start)?Math.round((s.end-s.start)/60000):null,P,Sd};
}
const diffLabel=v=>v<1.6?'Facile':v<2.5?'Correcte':v<3.4?'Dure':'Très dure';

const e1adj=x=>e1rm(x.w,x.r+(x.test?0:(DIFF_RESERVE[x.diff]??2)));

function exTrend(exId){
  const H=exHistory(exId),a=2/(SMOOTH_N+1);let sm=null;
  return H.map(x=>{const v=Math.max(0,...x.sets.map(e1adj));sm=sm==null?v:sm+a*(v-sm);return Object.assign({},x,{adj:v,smooth:sm})});
}
function idealLoad(exId,reps,inc){
  const T=exTrend(exId);if(!T.length)return null;
  const sm=T[T.length-1].smooth;return {sm,n:Math.min(T.length,SMOOTH_N*2),w:roundDown(sm/(1+(reps+2)/30),inc||2.5),reps};
}
function exHistory(exId){
  const out=[];sortedSessions().forEach(s=>{const e=s.exos.find(x=>x.exId===exId);if(!e||!e.sets.length)return;
    let top=0,best=0;e.sets.forEach(x=>{if(x.w>top)top=x.w;const v=e1rm(x.w,x.r);if(v>best)best=v});
    out.push({id:s.id,exId,date:s.date,sets:e.sets,top,best})});
  return out;
}
function recomputePRs(){
  const best={};
  sortedSessions().forEach(s=>s.exos.forEach(e=>{const b=best[e.exId];let mw=b?b.mw:0,be=b?b.be:0;
    e.sets.forEach(x=>{delete x.pr;if(!(x.w>0&&x.r>0))return;const v=e1rm(x.w,x.r);
      if(b){if(x.w>mw)x.pr=true;else if(v>be+0.01)x.pr=true}
      mw=Math.max(mw,x.w);be=Math.max(be,v)});
    best[e.exId]={mw,be}}));
}

function render(){
  syncWake();

  if(S.active&&ui.inSess!==false){app.innerHTML=sessionView();initCarousels();syncTimer();return}
  if(S.active)syncTimer();else clearInterval(tickI);
  const V={home:homeView,cal:calView,food:foodView,exos:exosView,hist:histView,tools:toolsView,lib:libView,exo:exoView,log:logView,sess:sessView};

/* ----- séance guidée (style openGym) ----- */
function curEx(){const A=S.active;return exById(A.order[A.idx])}
function buildDrafts(ex){const A=S.active,done=(A.data[ex.id]||[]).length,sg=suggest(ex),out=[];
  for(let j=done;j<ex.sets;j++)out.push({w:sg.w,r:sg.reps[Math.min(j,sg.reps.length-1)]||ex.repMin,diff:'correct',exec:'propre'});
  return out}
function initForm(rebuild){
  const A=S.active,ex=curEx();A.drafts=A.drafts||{};
  if(!ex){A.form={msg:''};return}
  const sg=suggest(ex);
  if(rebuild||!A.drafts[ex.id])A.drafts[ex.id]=buildDrafts(ex);
  A.form={msg:sg.msg,tag:sg.tag,test:false,est:null};
}
function startSession(type){
  const T=tplById(type),list=exFor(type);if(!T||!list.length)return toast('Aucun exo dans cette séance');
  unlockAudio();
  S.active={type,typeName:T.name,date:todayISO(),start:Date.now(),order:list.map(e=>e.id),idx:0,data:{},drafts:{},timerEnd:null,timerTotal:0,timerNext:'',finished:false,note:'',stretchDone:[]};
  ui.inSess=true;initForm(true);save();render();window.scrollTo(0,0);
}
function sessCounts(){const A=S.active;let done=0,total=0;A.order.forEach(id=>{const e=exById(id),d=(A.data[id]||[]).length,p=((A.drafts||{})[id]||[]).length;done+=d;total+=e?Math.max(e.sets,d+p):d});return {done,total}}
function sessHead(finish){
  const A=S.active,c=sessCounts();
  return `<div class="hud-top">${finish?`<button class="rbtn" data-act="backToSession" aria-label="Revenir à la séance">‹</button>`:`<button class="rbtn" data-act="abandon" aria-label="Abandonner la séance">✕</button>`}
    <div class="hud-title"><b>${esc(A.typeName)}</b><span class="muted num"><span id="chrono">${fmtDur(Date.now()-A.start)}</span> · ${c.done}/${c.total} séries</span></div>
    <div class="row" style="gap:6px">${finish?'<span style="width:42px"></span>':`<button class="rbtn" data-act="sessEdit" aria-label="Modifier la séance">⋯</button><button class="rbtn ok" data-act="goFinish" aria-label="Terminer la séance">✓</button>`}</div></div>
  <div class="pbar"><i style="width:${c.total?Math.round(c.done/c.total*100):0}%"></i></div>`;
}
const PROG_ICON={up:'↑',plus:'↗',hold:'→',stag:'→',down:'↓'};
function mediaHTML(ex){
  const ph=mediaURL[ex.id+'|photo'],gf=mediaURL[ex.id+'|gif'];
  if(!ph&&!gf)return `<button class="media-empty" data-act="exMenu" data-v="${ex.id}">📷 Ajoute la photo de la machine ou un GIF du mouvement</button>`;
  const slides=[];if(ph)slides.push(['photo','Machine']);if(gf)slides.push(['gif','Mouvement']);
  const start=Math.max(0,slides.findIndex(s=>s[0]===(ui.mview||{})[ex.id]));
  const slide=([k,l])=>{const key=ex.id+'|'+k,url=mediaURL[key],vid=(mediaType[key]||'').startsWith('video');
    return `<div class="mslide">${vid?`<video src="${url}" autoplay loop muted playsinline></video>`:`<img src="${url}" alt="${esc(ex.name)} : ${l.toLowerCase()}">`}<span class="mlabel">${l}</span></div>`};
  return `<div class="media"><div class="mcar" data-ex="${ex.id}" data-start="${start}" data-kinds="${slides.map(s=>s[0]).join(',')}" aria-label="${slides.length>1?'Glisse pour passer de la machine au mouvement':esc(ex.name)}">${slides.map(slide).join('')}</div>
    <div class="mbar">${slides.length>1?`<span class="mdots" aria-hidden="true">${slides.map((s,n)=>`<i class="${n===start?'on':''}"></i>`).join('')}</span>`:'<span></span>'}<button data-act="exMenu" data-v="${ex.id}">Changer</button></div></div>
  ${slides.length<2?`<button class="sm ghost" data-act="mediaPick" data-v="${ex.id}|${ph?'gif':'photo'}" style="margin-top:6px;width:100%">+ ${ph?'Ajouter le GIF du mouvement':'Ajouter la photo de la machine'}</button>`:''}`;
}
function initCarousels(){document.querySelectorAll('.mcar').forEach(c=>{const s=Number(c.dataset.start)||0;if(s)c.scrollLeft=s*c.clientWidth})}
document.addEventListener('scroll',ev=>{const c=ev.target;if(!c.classList||!c.classList.contains('mcar'))return;
  const i=Math.round(c.scrollLeft/(c.clientWidth||1)),kinds=c.dataset.kinds.split(',');ui.mview=ui.mview||{};ui.mview[c.dataset.ex]=kinds[i]||kinds[0];
  c.parentElement.querySelectorAll('.mdots i').forEach((d,j)=>d.classList.toggle('on',j===i))},true);
function sessionView(){
  const A=S.active;
  if(A.finished||A.idx>=A.order.length)return finishView();
  const ex=curEx();
  if(!ex){A.idx++;initForm();return sessionView()}
  if(!A.drafts||!A.drafts[ex.id])initForm();
  const sets=A.data[ex.id]||[],dr=A.drafts[ex.id],f=A.form||{},sg=suggest(ex),rec=exRecords(ex.id);
  const last=sg.last?`Dernière fois (${fmtDate(sg.last.date)}) : ${sg.last.sets.map(x=>`${fmt(x.w)}×${x.r}`).join(', ')}`:'Première fois sur cet exo';
  const fe=x=>(x.test?'🎯':DIFF.find(d=>d[0]===x.diff)[2])+EXEC.find(d=>d[0]===x.exec)[2];
  const rows=sets.map((x,i)=>`<div class="srow done"><span class="sn">${i+1}</span><span class="stp ro num">${fmt(x.w)}</span><span class="stp ro num">${x.r}${x.pr?' 🏆':''}</span><span class="feel" style="display:flex;align-items:center;justify-content:center">${fe(x)}</span>
      <button class="chk" data-act="undoSet" data-v="${i}" aria-label="Série ${i+1} validée, toucher pour annuler">✓</button></div>`).join('')
    +dr.map((x,j)=>{const k=sets.length+j;return `<div class="srow ${j===0?'next':''}"><span class="sn">${k+1}</span>
      <div class="stp"><button data-act="dw-" data-v="${j}" aria-label="Moins de poids">−</button><input class="num" data-dw="${j}" inputmode="decimal" placeholder="kg" value="${x.w==null?'':String(x.w).replace('.',',')}" aria-label="Poids série ${k+1}"><button data-act="dw+" data-v="${j}" aria-label="Plus de poids">+</button></div>
      <div class="stp"><button data-act="dr-" data-v="${j}" aria-label="Moins de reps">−</button><input class="num" data-dr="${j}" inputmode="numeric" value="${x.r??''}" aria-label="Reps série ${k+1}"><button data-act="dr+" data-v="${j}" aria-label="Plus de reps">+</button></div>
      <button class="feel" data-act="feel" data-v="${j}" aria-label="Ressenti série ${k+1}">${j===0&&f.test?'🎯':fe(x)}</button>
      <button class="chk" data-act="valRow" data-v="${j}" aria-label="Valider la série ${k+1}"></button></div>`}).join('');
  return `${sessHead()}
  <div class="row between"><span class="muted">Exo ${A.idx+1} / ${A.order.length}</span>
    <span class="row" style="gap:6px"><button class="rbtn sm" data-act="prevEx" ${A.idx===0?'disabled':''} aria-label="Exo précédent">‹</button><button class="rbtn sm" data-act="nextEx" aria-label="Exo suivant">›</button></span></div>
  <div class="row between" style="margin-top:8px"><h1 class="exname">${esc(ex.name)}</h1><button class="rbtn" data-act="exMenu" data-v="${ex.id}" aria-label="Options de l’exo">⋯</button></div>
  ${mediaHTML(ex)}
  <div class="chips" style="margin:8px 0">${ex.primary.map(m=>`<span class="tag">${esc(m)}</span>`).join('')}<span class="tag">${ex.prog==='lin'?'Linéaire':'Double progression'}</span>${rec?`<span class="tag">Record : ${fmt(rec.maxW)} kg</span>`:''}</div>
  <p class="muted small" style="margin:0">${esc(last)}</p>
  ${ex.notes?`<p class="muted small" style="margin:2px 0 0">⚙ ${esc(ex.notes)}</p>`:''}
  ${tipsHTML(ex)}
  ${f.msg?`<p class="prog ${f.tag||''}"><b>${PROG_ICON[f.tag]||'→'}</b> ${esc(f.msg)}</p>`:''}
  ${(()=>{const il=idealLoad(ex.id,ex.repMin,ex.inc);return il?`<p class="muted small" style="margin:4px 0 0">≈ Charge idéale : <b style="color:var(--chalk)">${fmt(il.w)} kg × ${il.reps}</b> · max lissé ${fmt(Math.round(il.sm))} kg sur ${il.n} séance${il.n>1?'s':''}</p>`:''})()}
  <div class="stable"><div class="shead"><span></span><span>POIDS (KG)</span><span>REPS</span><span>RESSENTI</span><span></span></div>${rows}
    ${S.settings.hideLegend?`<button class="tipadd" data-act="toggleLegend" style="padding:6px 4px 2px">❔ Que veulent dire les ressentis ?</button>`
      :`<div style="margin-top:8px"><div class="row between"><span class="muted small" style="font-weight:700">Ressenti</span><button class="tipadd" data-act="toggleLegend" style="padding:0">Masquer</button></div>${feelLegend()}</div>`}
    <div class="row" style="margin-top:6px;gap:6px"><button class="sm grow" data-act="restNow">⏱ Repos</button><button class="sm grow" data-act="addRow">+ série</button><button class="sm grow ${f.test?'primary':''}" data-act="testToggle">🎯 Jusqu’à l’échec</button></div>
    ${f.test?`<label class="f" for="fest">Prochaine série jusqu’à l’échec : combien de reps penses-tu faire ?</label><input id="fest" class="num" inputmode="numeric" value="${f.est??''}" placeholder="Ex. 12">`:''}
  </div>
  <p class="muted small" style="margin-top:8px">Repos ${ex.rest} s · touche le rond pour valider une série, ⋯ pour la photo, la progression ou une autre machine.</p>
  <button class="ghost" data-act="sessEdit" style="width:100%;margin-top:4px">⇄ Machine prise ? Remplacer, ajouter ou retirer un exo</button>
  ${A.timerEnd&&A.timerEnd>Date.now()?timerHTML():''}`;
}
function captureRows(){const A=S.active;if(!A)return;const ex=curEx();if(!ex)return;const dr=A.drafts[ex.id]||[];
  document.querySelectorAll('[data-dw]').forEach(i=>{const x=dr[Number(i.dataset.dw)];if(x)x.w=num(i.value)});
  document.querySelectorAll('[data-dr]').forEach(i=>{const x=dr[Number(i.dataset.dr)];if(x){const v=num(i.value);x.r=v==null?null:Math.round(v)}});
  const fe=document.getElementById('fest');if(fe&&A.form)A.form.est=num(fe.value)}
function feelHTML(j){const A=S.active,x=A.drafts[curEx().id][j];
  return `<h2 style="margin-top:0">Ressenti de la série</h2>
  <label class="f">Difficulté</label><div class="opts c4">${DIFF.map(d=>`<button class="opt ${d[0]} ${x.diff===d[0]?'on':''}" data-act="feelDiff" data-v="${j}|${d[0]}"><span>${d[2]}</span>${d[1]}</button>`).join('')}</div>
  <label class="f">Exécution</label><div class="opts c3">${EXEC.map(d=>`<button class="opt ${d[0]} ${x.exec===d[0]?'on':''}" data-act="feelExec" data-v="${j}|${d[0]}"><span>${d[2]}</span>${d[1]}</button>`).join('')}</div>
  <div style="margin-top:12px">${feelLegend(x)}</div>
  <button class="primary big" data-act="closeModal" style="margin-top:14px">OK</button>`}
function timerHTML(){
  const A=S.active,left=Math.max(0,Math.ceil((A.timerEnd-Date.now())/1000)),C=2*Math.PI*46;
  const frac=A.timerTotal?left/A.timerTotal:0;
  return `<div id="timer" role="timer"><p class="muted">${A.timerKind==='stretch'?'Étirement':'Repos'} · séance <span class="num" id="chronoT">${fmtDur(Date.now()-A.start)}</span></p>
  <div class="plate"><svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="var(--slab2)" stroke-width="7"/>
    <circle id="tRing" cx="50" cy="50" r="46" fill="none" stroke="${A.timerKind==='stretch'?'var(--green)':'var(--blue)'}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${C}" stroke-dashoffset="${C*(1-frac)}"/>
    <circle cx="50" cy="50" r="9" fill="var(--iron)" stroke="var(--line)" stroke-width="2"/></svg>
    <div class="t"><b id="tLeft" class="num">${Math.floor(left/60)}:${String(left%60).padStart(2,'0')}</b></div></div>
  <p style="margin-top:18px;font-weight:700">${esc(A.timerNext)}</p>
  <div class="row" style="margin-top:14px"><button data-act="tAdd" data-v="-15">−15 s</button><button data-act="tAdd" data-v="30">+30 s</button><button class="primary" data-act="tSkip">${A.timerKind==='stretch'?'Terminé':'C’est reparti'}</button></div></div>`;
}
function startTimer(sec,next,kind){const A=S.active;A.timerTotal=sec;A.timerEnd=Date.now()+sec*1000;A.timerNext=next;A.timerKind=kind||'rest'}
let tickI=null;
function syncTimer(){clearInterval(tickI);if(!S.active)return;tickI=setInterval(tick,250);}
function tick(){
  const A=S.active;if(!A){clearInterval(tickI);return}
  const d=fmtDur(Date.now()-A.start);
  const c=document.getElementById('chrono');if(c&&c.textContent!==d)c.textContent=d;
  const c2=document.getElementById('chronoT');if(c2&&c2.textContent!==d)c2.textContent=d;

    const left=Math.ceil((A.timerEnd-Date.now())/1000);

}
function validateRow(j,force){
  const A=S.active,ex=curEx();captureRows();
  const dr=A.drafts[ex.id],x=dr[j];if(!x)return;
  const w=x.w,r=x.r,f=A.form||{};
  if(w==null||w<0)return toast('Indique le poids');
  if(r==null||r<0)return toast('Indique le nombre de reps');
  {const sg=suggest(ex),ref=sg.w||((A.data[ex.id]||[]).slice(-1)[0]||{}).w;
   if(!force&&(w>300||(ref&&w>ref*2&&w-ref>20)||r>50))return ask(`${fmt(w)} kg × ${r} reps, c’est bien ça ?`,`${ref?`Charge proposée : ${fmt(ref)} kg. `:''}Touche Annuler pour corriger.`,()=>validateRow(j,true),'Oui, valider la série');}
  let estMsg='';
  if(f.test&&(f.est==null||f.est<1))return toast('Indique ton estimation avant la série 🎯');
  unlockAudio();
  const arr=A.data[ex.id]||(A.data[ex.id]=[]);
  if(f.test){const est=Math.round(f.est),gap=r-est;
    arr.push({w,r,diff:'echec',exec:x.exec,test:true,est});
    estMsg=gap===0?`Estimation parfaite : ${r} reps.`:gap>0?`Tu en as fait ${gap} de plus que prévu (${est} estimées, ${r} réalisées) : tu sous-estimes ta marge.`:`Tu en as fait ${-gap} de moins que prévu (${est} estimées, ${r} réalisées).`;
    A.form.test=false;A.form.est=null;
  }else arr.push({w,r,diff:x.diff,exec:x.exec});
  dr.splice(j,1);
  let prMsg='';{const js=arr[arr.length-1],rec=exRecords(ex.id);
    if(rec&&js.w>0&&js.r>0){const prev=arr.slice(0,-1);
      const maxW=Math.max(rec.maxW,...prev.map(y=>y.w)),best=Math.max(rec.best,...prev.map(y=>e1rm(y.w,y.r))),v=e1rm(js.w,js.r);
      if(js.w>maxW){js.pr=true;prMsg=`🏆 Record de charge : ${fmt(js.w)} kg !`}
      else if(v>best+0.01){js.pr=true;prMsg=`🏆 Record : max estimé ${fmt(Math.round(v))} kg !`}}}
  // série sous la fourchette : on baisse les séries restantes ; sinon elles suivent la charge validée
  if(r<=ex.repMin-2){const nw=roundDown(w*0.925,ex.inc);dr.forEach(y=>y.w=nw);A.form.msg=`Série sous la fourchette : ${fmt(nw)} kg pour la suite (−7,5 %).`;A.form.tag='down'}
  else dr.forEach(y=>{if(y.w==null)y.w=w});
  if(estMsg){A.form.msg=estMsg;A.form.tag='hold'}
  if(!dr.length){
    if(A.idx<A.order.length-1){A.idx++;initForm();const nx=curEx(),nd=A.drafts[nx.id][0];
      startTimer(ex.rest,`Prochain exo : ${nx.name}${nd?`, ${nd.w==null?'? kg':fmt(nd.w)+' kg'} × ${nd.r}`:''}`);
      if(estMsg){A.form.msg=estMsg;A.form.tag='hold'}}
    else A.finished=true;
  }else startTimer(ex.rest,`Série ${arr.length+1} : ${dr[0].w==null?'? kg':fmt(dr[0].w)+' kg'} × ${dr[0].r}`);
  if(prMsg||estMsg)toast([prMsg,estMsg].filter(Boolean).join(' '));
  save();render();if(A.finished||!dr.length)window.scrollTo(0,0);
}

function kcalChart(){
  const st=S.settings,T=new Date(),days=Array.from({length:14},(_,i)=>iso(addDays(T,i-13)));
  const vals=days.map(d=>(S.nutrition[d]||{}).kcal||0),mx=Math.max(st.kcalTarget*1.15,...vals),H=120,W=340,bw=W/14;
  const y=v=>H-v/mx*H;
  return `<svg viewBox="0 0 ${W} ${H+16}" width="100%" role="img" aria-label="Calories par jour">
  ${vals.map((v,i)=>`<rect x="${i*bw+3}" y="${y(v)}" width="${bw-6}" height="${H-y(v)}" rx="3" fill="${v>=st.kcalTarget*0.95?'var(--green)':'var(--blue)'}"/>`).join('')}
  <line x1="0" x2="${W}" y1="${y(st.kcalTarget)}" y2="${y(st.kcalTarget)}" stroke="var(--yellow)" stroke-dasharray="4 4"/>
  ${days.map((d,i)=>i%2===0?`<text x="${i*bw+bw/2}" y="${H+13}" text-anchor="middle">${parseISO(d).getDate()}</text>`:'').join('')}</svg>`;
}
function bwChart(){
  const T=new Date(),pts=[];for(let i=59;i>=0;i--){const d=iso(addDays(T,-i)),e=S.nutrition[d];if(e&&e.bw)pts.push([59-i,e.bw])}
  if(pts.length<2)return '<p class="muted small" style="margin-top:6px">Renseigne ton poids du matin 3 à 4 fois par semaine pour voir la courbe.</p>';
  const goal=S.settings.weightTarget,W=340,H=120,vs=pts.map(p=>p[1]);let mn=Math.min(...vs)-0.5,mx=Math.max(...vs)+0.5;
  const goalIn=goal<=mx+3&&goal>=mn-3;if(goalIn){mn=Math.min(mn,goal-0.5);mx=Math.max(mx,goal+0.5)}
  const X=i=>i/59*(W-30)+28,Y=v=>6+(H-12)-(v-mn)/(mx-mn)*(H-12);
  const gy=goalIn?Y(goal):goal>mx?2:H;
  const segs=pts.slice(1).map((p,i)=>{const a=pts[i],good=(p[1]-a[1])*(goal>=a[1]?1:-1)>=0;
    return `<line x1="${X(a[0])}" y1="${Y(a[1])}" x2="${X(p[0])}" y2="${Y(p[1])}" stroke="${good?'var(--green)':'var(--red)'}" stroke-width="2.5" stroke-linecap="round"/>`}).join('');
  const last=pts[pts.length-1][1];
  return `<svg viewBox="0 0 ${W} ${H+6}" width="100%" role="img" aria-label="Poids et objectif">
  <text x="0" y="12">${fmt(Math.round(mx*10)/10)}</text><text x="0" y="${H}">${fmt(Math.round(mn*10)/10)}</text>
  <line x1="28" x2="${W}" y1="${gy}" y2="${gy}" stroke="var(--yellow)" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="${W}" y="${gy<20?gy+13:gy-5}" text-anchor="end" style="fill:var(--yellow)">objectif ${fmt(goal)} kg${goalIn?'':goal>mx?' ↑':' ↓'}</text>
  ${segs}${pts.map(p=>`<circle cx="${X(p[0])}" cy="${Y(p[1])}" r="2.5" fill="var(--chalk)"/>`).join('')}</svg>
  <p class="muted small" style="margin:6px 0 0"><span class="dot" style="background:var(--green)"></span>vers l’objectif <span class="dot" style="background:var(--red);margin-left:8px"></span>dans l’autre sens${goalIn?'':' · ligne jaune : objectif hors de l’échelle'}</p>
  <p class="muted small" style="margin:4px 0 0">Objectif ${fmt(goal)} kg : ${(goal>=pts[0][1]?last>=goal:last<=goal)?'atteint 🎉':`encore ${fmt(Math.round(Math.abs(goal-last)*10)/10)} kg.`}</p>`;
}

function saveEx(){
  const e=ui.edit;
  document.querySelectorAll('#sheet [data-f]').forEach(i=>{e[i.dataset.f]=i.value});
  e.name=String(e.name).trim();if(!e.name)return toast('Donne un nom à l’exo');
  ['sets','rest','repMin','repMax'].forEach(k=>e[k]=Math.max(k==='rest'?0:1,Math.round(num(e[k])||0)));
  e.inc=num(e.inc)||2.5;e.startWeight=num(e.startWeight);e.tips=String(e.tips||'').trim();
  if(e.repMax<e.repMin)e.repMax=e.repMin;
  if(!e.primary.length)return toast('Choisis au moins un muscle principal');
  e.secondary=e.secondary.filter(m=>!e.primary.includes(m));
  const tpls=e._tpls;delete e._tpls;
  S.templates.forEach(t=>{const has=t.exIds.includes(e.id);if(tpls.includes(t.id)&&!has)t.exIds.push(e.id);if(!tpls.includes(t.id)&&has)t.exIds=t.exIds.filter(x=>x!==e.id)});
  const i=S.exercises.findIndex(x=>x.id===e.id);if(i>=0)S.exercises[i]=e;else S.exercises.push(e);
  save();closeModal();render();toast('Exo enregistré');
}

/* ----- historique ----- */
function histView(){
  const T=todayISO(),ss=sortedSessions().reverse();
  const tests=[];S.sessions.forEach(s=>s.exos.forEach(e=>e.sets.forEach(x=>{if(x.test&&x.est!=null)tests.push(x.r-x.est)})));
  const recent=tests.slice(-10),avgGap=recent.length?recent.reduce((a,b)=>a+b,0)/recent.length:null;
  const verdict=avgGap==null?'Fais une série jusqu’à l’échec (bouton 🎯 pendant la séance) pour calibrer ton ressenti.':
    Math.abs(avgGap)<=1?'Ton ressenti est fiable : ton estimation tombe à 1 rep près.':
    avgGap>1?`Tu sous-estimes ta marge de ${fmt(Math.round(avgGap*10)/10)} reps en moyenne : tes séries « Dur » sont sûrement plutôt « Correct ».`:
    `Tu surestimes ta marge de ${fmt(Math.round(-avgGap*10)/10)} reps en moyenne : sois prudent avec la note « Facile ».`;
  const withH=S.exercises.map(e=>({e,H:exHistory(e.id)})).filter(x=>x.H.length).sort((a,b)=>a.e.name.localeCompare(b.e.name));
  return `<h1>Stats</h1>
  <h2>Carte des muscles</h2>
  <div class="box">${bodyMap()}</div>
  <h2>Progression par exo</h2>
  <div class="box">${withH.length?withH.map(({e,H})=>{const d=H[H.length-1].best-H[0].best;return `<button class="list-item" data-act="openExo" data-v="${e.id}"><span class="grow"><h3>${esc(e.name)}</h3>
    <span class="muted small">max estimé ${fmt(Math.round(Math.max(...H.map(x=>x.best))))} kg · ${H.length} séance${H.length>1?'s':''}</span></span>
    <span class="num" style="font-weight:750;color:${d>0?'var(--green)':'var(--dust)'}">${H.length>1?(d>0?'+':'')+fmt(Math.round(d))+' kg':'—'}</span></button>`}).join(''):'<p class="muted">Tes courbes apparaîtront après ta première séance.</p>'}</div>
  <h2>Ton ressenti</h2>
  <div class="box"><p style="margin:0">${verdict}</p>${recent.length?`<p class="muted small" style="margin:6px 0 0">${recent.length>1?`Sur tes ${recent.length} dernières séries test.`:'Sur ta dernière série test.'}</p>`:''}</div>
  <button class="big" data-act="tab" data-v="log" style="margin-top:14px">📋 Voir l’historique des séances (${ss.length})</button>`;
}

/* ----- onglet Historique : séances précédentes en détail ----- */
function prevOcc(exId,s){const L=sortedSessions();const i=L.findIndex(x=>x.id===s.id);
  for(let j=i-1;j>=0;j--){const e=L[j].exos.find(x=>x.exId===exId);if(e&&e.sets.length)return {date:L[j].date,sets:e.sets}}return null}
const bestOf=sets=>Math.max(0,...sets.map(x=>e1rm(x.w,x.r)));
function deltaBadge(cur,prev){if(!prev)return '<span class="tag" style="font-size:11.5px">1re fois</span>';
  const d=bestOf(cur)-bestOf(prev.sets);if(Math.abs(d)<0.5)return '<span class="tag" style="font-size:11.5px">=</span>';
  return `<span class="tag" style="font-size:11.5px;background:${d>0?'rgba(48,209,88,.18)':'rgba(255,69,58,.18)'};color:${d>0?'var(--green)':'var(--red)'}">${d>0?'↑ +':'↓ '}${fmt(Math.round(d))} kg</span>`}
function logView(){
  const f=ui.logF||'',all=sortedSessions().reverse(),ss=all.filter(s=>!f||s.type===f);
  const now=new Date(),thisM=iso(now).slice(0,7),durs=all.map(s=>sessionStats(s).dur).filter(x=>x);
  const groups=[];ss.forEach(s=>{const k=s.date.slice(0,7);let g=groups.find(x=>x.k===k);if(!g)groups.push(g={k,list:[]});g.list.push(s)});
  const card=s=>{const st=sessionStats(s),prs=s.exos.reduce((t,e)=>t+e.sets.filter(x=>x.pr).length,0);
    const t0=s.start&&s.start>1e11?new Date(s.start).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):'';
    return `<button class="box" data-act="openSess" data-v="${s.id}" style="display:block;width:100%;text-align:left;padding:14px 16px">
      <div class="row between"><span class="row" style="gap:8px">${tagHTML(s.type,s.typeName)}<b>${esc(s.typeName)}</b></span><span class="muted small" style="text-transform:capitalize">${fmtDate(s.date)}${t0?' · '+t0:''}</span></div>
      <div class="row muted small" style="gap:12px;margin:8px 0 10px;flex-wrap:wrap"><span>⏱ ${st.dur??'—'} min</span><span>${st.sets} séries</span><span>${fmt(Math.round(st.vol))} kg</span><span>✅ ${st.execPct} %</span>${prs?`<span style="color:var(--green)">🏆 ${prs}</span>`:''}</div>
      ${s.exos.map(e=>`<div class="row between" style="padding:5px 0;border-top:1px solid var(--line);gap:8px"><span class="grow" style="min-width:0"><span style="font-weight:650">${esc(e.name)}</span><br><span class="muted small num">${e.sets.map(x=>`${fmt(x.w)}×${x.r}${x.pr?'🏆':''}`).join('  ')}</span></span>${deltaBadge(e.sets,prevOcc(e.exId,s))}</div>`).join('')}
      ${s.note?`<p class="muted small" style="margin:8px 0 0">📝 ${esc(s.note)}</p>`:''}</button>`};
  return `<div class="row between"><h1>Historique</h1><button class="sm" data-act="addPast">+ Séance passée</button></div>
  <div class="grid3" style="margin:10px 0 12px"><div class="stat"><div class="kpi num">${all.length}</div><div class="muted small">séances</div></div>
    <div class="stat"><div class="kpi num">${all.filter(s=>s.date.slice(0,7)===thisM).length}</div><div class="muted small">ce mois</div></div>
    <div class="stat"><div class="kpi num">${durs.length?Math.round(durs.reduce((a,b)=>a+b,0)/durs.length):'—'}</div><div class="muted small">min en moyenne</div></div></div>
  <div class="chips" style="margin-bottom:12px"><button class="chip ${!f?'on':''}" data-act="logF" data-v="">Toutes</button>${S.templates.filter(t=>all.some(s=>s.type===t.id)).map(t=>`<button class="chip ${f===t.id?'on':''}" data-act="logF" data-v="${t.id}">${esc(t.name)}</button>`).join('')}</div>
  ${groups.map(g=>`<h2 style="text-transform:capitalize;margin-top:14px">${parseISO(g.k+'-01').toLocaleDateString('fr-FR',{month:'long',year:'numeric'})}</h2>${g.list.map(card).join('')}`).join('')
    ||'<div class="box"><p class="muted" style="margin:0">Aucune séance pour l’instant. Lance ta première depuis l’accueil, ou ajoute une séance passée.</p></div>'}`;
}
function sessView(){
  const s=S.sessions.find(x=>x.id===ui.sessId);if(!s){ui.tab='log';return logView()}
  const st=sessionStats(s),prs=s.exos.reduce((t,e)=>t+e.sets.filter(x=>x.pr).length,0);
  const t0=s.start&&s.start>1e11?new Date(s.start).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}):'';

  <p class="muted" style="text-transform:capitalize;margin:4px 0 0">${parseISO(s.date).toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}${t0?' · début '+t0:''}</p>
  <div class="grid3" style="margin:12px 0">
    <div class="stat"><div class="kpi num">${st.dur??'—'}</div><div class="muted small">minutes</div></div>
    <div class="stat"><div class="kpi num">${st.sets}</div><div class="muted small">séries</div></div>
    <div class="stat"><div class="kpi num">${fmt(Math.round(st.vol))}</div><div class="muted small">kg soulevés</div></div>
    <div class="stat"><div class="kpi num">${st.execPct} %</div><div class="muted small">exécution propre</div></div>
    <div class="stat"><div class="kpi" style="font-size:20px">${diffLabel(st.diff)}</div><div class="muted small">difficulté</div></div>
    <div class="stat"><div class="kpi num">${prs}</div><div class="muted small">record${prs>1?'s':''}</div></div></div>

  <h2>Volume de la séance</h2><div class="box">${sessionVolMap(s.exos,'musInfoSess')}</div>
  <h2>Exercices (${s.exos.length})</h2>

    return `<div class="box"><div class="row between" style="gap:8px"><h3 style="margin:0">${esc(e.name)}</h3>${deltaBadge(e.sets,pv)}</div>
    <div class="chips" style="margin:6px 0 8px">${(e.primary||[]).map(m=>`<span class="tag p">${esc(m)}</span>`).join('')}</div>
    <div class="shead" style="grid-template-columns:28px 1fr 1fr 1fr 64px"><span>#</span><span>POIDS</span><span>REPS</span><span>VOLUME</span><span>RESSENTI</span></div>
    ${e.sets.map((x,i)=>`<div class="num" style="display:grid;grid-template-columns:28px 1fr 1fr 1fr 64px;gap:6px;text-align:center;padding:7px 0;border-top:1px solid var(--line)">
      <span class="muted">${i+1}</span><b>${fmt(x.w)} kg</b><b>${x.r}${x.pr?' 🏆':''}</b><span class="muted">${fmt(x.w*x.r)}</span><span>${x.test?`🎯${x.est}`:DIFF.find(d=>d[0]===x.diff)[2]}${EXEC.find(d=>d[0]===x.exec)[2]}</span></div>`).join('')}
    <p class="muted small" style="margin:8px 0 0">Volume ${fmt(vol)} kg · max estimé ${fmt(Math.round(b))} kg${pv?` · la fois d’avant (${fmtDate(pv.date)}) : ${pv.sets.map(x=>`${fmt(x.w)}×${x.r}`).join(', ')}, max estimé ${fmt(Math.round(bestOf(pv.sets)))} kg`:''}</p>
    <button class="sm ghost" data-act="openExo" data-v="${e.exId}" style="margin-top:8px">📈 Progression de l’exo</button></div>`}).join('')}

}

function tipsHTML(ex){

    :`<button class="tipadd" data-act="editTips" data-v="${ex.id}">💡 Ajouter un conseil d’exécution</button>`;
}
function tipsForm(id){const e=exById(id);
  return `<h2 style="margin-top:0">💡 Conseils · ${esc(e.name)}</h2>

  <div class="row" style="margin-top:12px"><button class="primary grow" data-act="saveTips" data-v="${id}">Enregistrer</button><button class="ghost" data-act="closeModal">Annuler</button></div>`}

const MM_MAP={F:{chest:['Pectoraux'],upperChest:['Pectoraux'],lowerChest:['Pectoraux'],abs:['Abdominaux'],upperAbs:['Abdominaux'],lowerAbs:['Abdominaux'],
  biceps:['Biceps'],triceps:['Triceps'],deltoids:['Épaules avant','Épaules latérales'],frontDeltoid:['Épaules avant'],obliques:['Obliques'],
  quadriceps:['Quadriceps'],innerQuad:['Quadriceps'],outerQuad:['Quadriceps'],hipFlexors:['Quadriceps'],calves:['Mollets'],adductors:['Adducteurs'],
  trapezius:['Haut du dos / trapèzes'],forearm:['Avant-bras']},
  B:{trapezius:['Haut du dos / trapèzes'],deltoids:['Épaules arrière','Épaules latérales'],upperBack:['Grand dorsal'],triceps:['Triceps'],lowerBack:['Lombaires'],
  forearm:['Avant-bras'],gluteal:['Fessiers'],adductors:['Adducteurs'],hamstring:['Ischio-jambiers'],calves:['Mollets']}};
function bodyMap(home){
  const mode=home?'rec':ui.mapMode,T=todayISO(),from=iso(addDays(new Date(),-6)),vol={},last={};
  S.sessions.forEach(s=>s.exos.forEach(e=>{const n=e.sets.length;
    (e.primary||[]).forEach(m=>{if(s.date>=from)vol[m]=(vol[m]||0)+n;if(!last[m]||s.date>last[m])last[m]=s.date});
    (e.secondary||[]).forEach(m=>{if(s.date>=from)vol[m]=(vol[m]||0)+n*0.5})}));
  const vCol=v=>v===0?'#323943':v<4?'#8fb0e8':v<10?'var(--blue)':'var(--green)';
  const dCol=dd=>dd==null||(home&&dd>7)?'#323943':dd<=1?'var(--red)':dd<=4?'var(--green)':'var(--yellow)';
  const zone=ms=>{if(mode==='vol'){const v=Math.max(...ms.map(m=>vol[m]||0));return {c:vCol(v),i:ms.map(m=>`${m} : ${fmt(vol[m]||0)} séries sur 7 jours`).join(' · ')}}
    const ds=ms.filter(m=>last[m]).map(m=>daysBetween(last[m],T));const dd=ds.length?Math.min(...ds):null;
    return {c:dCol(dd),i:ms.map(m=>`${m} : ${last[m]?'travaillé '+agoTxt(daysBetween(last[m],T)):'jamais travaillé'}`).join(' · ')}};
  const fig=(k,vb,label)=>`<div style="flex:1;text-align:center"><svg viewBox="${vb}" style="width:100%;max-width:190px" role="img" aria-label="Muscles, vue ${label.toLowerCase()}">${MM[k].map(([slug,ps])=>{
      const ms=MM_MAP[k][slug];
      if(!ms)return ps.map(p=>`<path d="${p}" fill="#4a525e" stroke="var(--slab)" stroke-width="3"/>`).join('');
      const z=zone(ms);return ps.map(p=>`<path d="${p}" fill="${z.c}" stroke="var(--slab)" stroke-width="3" data-act="musTap" data-v="${esc(ms.join(' / '))}" data-i="${esc(z.i)}" style="cursor:pointer"/>`).join('')}).join('')}</svg><div class="muted small">${label}</div></div>`;
  const dot=(c,t,first)=>`<span class="dot" style="background:${c};${first?'':'margin-left:8px'}"></span>${t}`;
  const legend=mode==='vol'?dot('#323943','0',1)+dot('#8fb0e8','1-3')+dot('var(--blue)','4-9')+dot('var(--green)','10+ séries (cible : 10 à 20 par semaine)')
    :dot('var(--red)','en récupération',1)+dot('var(--green)','prêt')+dot('var(--yellow)','à retravailler')+dot('#323943',home?'pas cette semaine':'jamais');
  return `${home?'':`<div class="row" style="margin-bottom:8px"><button class="chip ${mode==='vol'?'on':''}" data-act="mapMode" data-v="vol">Volume 7 jours</button><button class="chip ${mode==='rec'?'on':''}" data-act="mapMode" data-v="rec">Récupération</button></div>`}
  <div class="row" style="align-items:flex-start">${fig('F','0 95 727 1280','Face')}${fig('B','718 95 727 1280','Dos')}</div>
  <p class="muted small" style="margin-top:8px">${legend}</p><p class="small" id="musInfo" style="margin:4px 0 0">Touche un muscle pour le détail.</p>
  ${(()=>{if(!S.sessions.length)return '';
    const L=mode==='vol'?MUSCLES.filter(m=>!(vol[m]>0)):home?MUSCLES.filter(m=>!last[m]||daysBetween(last[m],T)>7):MUSCLES.filter(m=>!last[m]||daysBetween(last[m],T)>=5);
    const title=mode==='vol'?'Pas travaillés ces 7 derniers jours':home?'Pas travaillés cette semaine':'Sans travail direct depuis 5 jours ou plus';
    return L.length?`<div class="note hold" style="margin-top:10px"><b>${title} (${L.length})</b><div class="chips" style="margin-top:6px">${L.map(m=>`<span class="tag s">${esc(m)}</span>`).join('')}</div></div>`
      :`<div class="note up" style="margin-top:10px">${mode==='vol'||home?'Tous tes muscles ont été travaillés cette semaine 👍':'Aucun muscle oublié depuis 5 jours 👍'}</div>`})()}`;
}

/* ----- carte du volume d'une séance ----- */
function sessionVolMap(exos,tid){
  const vol={};exos.forEach(e=>{const n=e.sets.length;(e.primary||[]).forEach(m=>vol[m]=(vol[m]||0)+n);(e.secondary||[]).forEach(m=>vol[m]=(vol[m]||0)+n*0.5)});
  const col=v=>v===0?'#323943':v<2?'#8fb0e8':v<4?'var(--blue)':'var(--green)';
  const zone=ms=>{const v=Math.max(...ms.map(m=>vol[m]||0));return {c:col(v),i:ms.map(m=>`${m} : ${fmt(vol[m]||0)} série${(vol[m]||0)>1?'s':''}`).join(' · ')}};
  const fig=(k,vb,label)=>`<div style="flex:1;text-align:center"><svg viewBox="${vb}" style="width:100%;max-width:170px" role="img" aria-label="Volume de la séance, vue ${label.toLowerCase()}">${MM[k].map(([slug,ps])=>{
      const ms=MM_MAP[k][slug];
      if(!ms)return ps.map(p=>`<path d="${p}" fill="#4a525e" stroke="var(--slab)" stroke-width="3"/>`).join('');
      const z=zone(ms);return ps.map(p=>`<path d="${p}" fill="${z.c}" stroke="var(--slab)" stroke-width="3" data-act="musTap" data-t="${tid}" data-v="${esc(ms.join(' / '))}" data-i="${esc(z.i)}" style="cursor:pointer"/>`).join('')}).join('')}</svg><div class="muted small">${label}</div></div>`;
  const dot=(c,t,first)=>`<span class="dot" style="background:${c};${first?'':'margin-left:8px'}"></span>${t}`;
  const top=Object.entries(vol).filter(([,v])=>v>=1).sort((a,b)=>b[1]-a[1]);
  return `<div class="row" style="align-items:flex-start">${fig('F','0 95 727 1280','Face')}${fig('B','718 95 727 1280','Dos')}</div>
  <p class="muted small" style="margin-top:8px">${dot('#8fb0e8','secondaire',1)+dot('var(--blue)','2-3 séries')+dot('var(--green)','4+ séries')}</p>
  <p class="small" id="${tid}" style="margin:4px 0 6px">Touche un muscle pour le détail.</p>
  <div class="chips">${top.map(([m,v])=>`<span class="tag p">${esc(m)} · ${fmt(v)}</span>`).join('')}</div>`;
}

/* ----- progression par exo ----- */
function exProgHTML(id){
  const ex=exById(id),H=exHistory(id),name=ex?ex.name:'Exo';
  if(!H.length)return `<h2 style="margin-top:0">${esc(name)}</h2><p class="muted">Pas encore de séance enregistrée pour cet exo.</p><button class="primary big" data-act="closeModal">Fermer</button>`;
  const rec=exRecords(id);
  return `<h2 style="margin-top:0">📈 ${esc(name)}</h2>
  <div class="grid3" style="margin:10px 0"><div class="stat"><div class="kpi num">${fmt(rec.maxW)}</div><div class="muted small">charge max (kg)</div></div>
    <div class="stat"><div class="kpi num">${fmt(Math.round(exTrend(id).slice(-1)[0].smooth))}</div><div class="muted small">max lissé (kg)</div></div>
    <div class="stat"><div class="kpi num">${rec.n}</div><div class="muted small">séances</div></div></div>
  <div class="box" style="background:var(--iron)">${progChart(H)}</div>
  <h3 style="margin-top:12px">Dernières séances</h3>
  ${H.slice(-8).reverse().map(x=>`<div class="setrow num"><span style="text-transform:capitalize">${fmtDate(x.date)}</span><span>${fmtSets(x.sets)}</span></div>`).join('')}
  <button class="primary big" data-act="closeModal" style="margin-top:14px">Fermer</button>`;
}
function progChart(H){
  if(H.length<2)return '<p class="muted small" style="margin:0">La courbe apparaîtra à partir de 2 séances.</p>';
  const T=exTrend(H[0].exId||ui.chartEx);const P=(T.length===H.length?T:H.map((x,i)=>Object.assign({},x,{adj:x.best,smooth:x.best}))).slice(-20);
  const W=340,Hh=130,vals=P.flatMap(x=>[x.adj,x.smooth,refW(x.sets)]),mn=Math.min(...vals)*0.95,mx=Math.max(...vals)*1.05;
  const X=i=>30+i/(P.length-1)*(W-40),Y=v=>Hh-(v-mn)/((mx-mn)||1)*(Hh-8)+4;
  const pts=f=>P.map((x,i)=>X(i)+','+Y(f(x))).join(' ');
  return `<svg viewBox="0 0 ${W} ${Hh+22}" width="100%" role="img" aria-label="Courbe de progression">
  <text x="0" y="12">${fmt(Math.round(mx))}</text><text x="0" y="${Hh+2}">${fmt(Math.round(mn))}</text>
  ${P.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.adj)}" r="3.2" fill="none" stroke="var(--green)" stroke-width="1.6"/>`).join('')}
  <polyline fill="none" stroke="var(--green)" stroke-width="3" points="${pts(x=>x.smooth)}"/>
  <polyline fill="none" stroke="var(--blue)" stroke-width="2" points="${pts(x=>refW(x.sets))}"/>${P.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(refW(x.sets))}" r="2.6" fill="var(--blue)"/>`).join('')}
  <text x="30" y="${Hh+20}">${fmtDate(P[0].date)}</text><text x="${W-4}" y="${Hh+20}" text-anchor="end">${fmtDate(P[P.length-1].date)}</text></svg>
  <p class="muted small" style="margin:6px 0 0"><span class="dot" style="background:var(--green)"></span>max lissé (tendance) · ○ max de la séance (ressenti inclus) <span class="dot" style="background:var(--blue);margin-left:8px"></span>charge de travail</p>`;
}

function captureSE(){
  const d=ui.sedit;if(!d)return;
  document.querySelectorAll('#sheet [data-se]').forEach(i=>{d[i.dataset.se]=i.value});
  const at=(i,k)=>{const[a,b]=i.dataset[k].split('-').map(Number);return d.exos[a]&&d.exos[a].sets[b]};
  document.querySelectorAll('#sheet [data-sw]').forEach(i=>{const x=at(i,'sw');if(x)x.w=i.value});
  document.querySelectorAll('#sheet [data-sr]').forEach(i=>{const x=at(i,'sr');if(x)x.r=i.value});
  document.querySelectorAll('#sheet [data-sd]').forEach(i=>{const x=at(i,'sd');if(x)x.diff=i.value});
}
function reopenSE(){const sh=document.getElementById('sheet'),sc=sh.scrollTop;openModal(seForm());sh.scrollTop=sc}
function saveSE(){
  captureSE();const d=ui.sedit;
  if(!d.date)return toast('Choisis une date');
  const exos=d.exos.map(e=>({exId:e.exId,name:e.name,primary:e.primary,secondary:e.secondary,sets:e.sets.map(x=>{
    const w=num(x.w),r=num(x.r);if(w==null||w<0||r==null||r<1)return null;
    const o={w,r:Math.round(r),diff:x.diff||'correct',exec:x.exec||'propre'};if(x.test){o.test=true;o.est=x.est}if(x.pr)o.pr=true;return o}).filter(Boolean)})).filter(e=>e.sets.length);
  if(!exos.length)return toast('Renseigne au moins une série (poids et reps)');
  const dur=Math.max(1,Math.round(num(d.dur)||60)),old=S.sessions.find(s=>s.id===d.id);
  const start=old&&old.date===d.date&&old.start?old.start:parseISO(d.date).getTime()+18*3600000;
  const s={id:d.id,date:d.date,type:d.type,typeName:d.typeName,start,end:start+dur*60000,exos,note:d.note||''};
  if(old)Object.assign(old,s);else S.sessions.push(s);
  recomputePRs();
  save();closeModal();render();toast(d.isNew?'Séance ajoutée':'Séance modifiée');
}

function altSuggestions(ex){
  const names=new Set(S.exercises.map(e=>e.name.toLowerCase()));
  const score=a=>{const p=a[1].filter(m=>ex.primary.includes(m)).length,s=a[2].filter(m=>ex.primary.includes(m)||ex.secondary.includes(m)).length;return p*10+s};
  return ALT_LIB.map((a,i)=>({a,i,sc:score(a)})).filter(x=>x.a[1].some(m=>ex.primary.includes(m))&&!names.has(x.a[0].toLowerCase())).sort((x,y)=>y.sc-x.sc).slice(0,6);
}
function createFromAlt(i){const a=ALT_LIB[i];const e={id:uid(),name:a[0],primary:a[1].slice(),secondary:a[2].slice(),sets:a[3],repMin:a[4],repMax:a[5],rest:a[6],inc:a[7]||2.5,startWeight:null,forceW:null,notes:a[8],prog:'double'};S.exercises.push(e);return e.id}
function swapCurrent(id){const A=S.active,fromId=A.order[A.idx],done=(A.data[fromId]||[]).length;
  {const to=exById(id),from=exById(fromId);if(to&&from&&!exHistory(id).length){const il=idealLoad(fromId,to.repMin,to.inc);
    to.swapFrom=il?{w:roundDown(il.w*0.8,to.inc),name:from.name}:null;if(A.drafts)delete A.drafts[id]}}if(done){A.order.splice(A.idx+1,0,id);A.idx++}else A.order[A.idx]=id;A.timerEnd=null;initForm()}

async function syncWake(){
  try{
    if(S.active&&!document.hidden){if(!wakeLock&&navigator.wakeLock){wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null})}}

/* ----- photos et GIF des machines (stockés dans le téléphone, hors du fichier de l'app) ----- */
const mediaURL={},mediaType={};let mdb=null;
function idb(){return new Promise((res,rej)=>{if(mdb)return res(mdb);if(!window.indexedDB)return rej(new Error('IndexedDB indisponible'));
  const r=indexedDB.open('carnetMuscuMedia',1);r.onupgradeneeded=()=>r.result.createObjectStore('m');r.onsuccess=()=>{mdb=r.result;res(mdb)};r.onerror=()=>rej(r.error)})}
function setURL(k,blob){if(mediaURL[k])URL.revokeObjectURL(mediaURL[k]);mediaURL[k]=URL.createObjectURL(blob);mediaType[k]=blob.type||''}
async function mPut(k,blob){const db=await idb();await new Promise((res,rej)=>{const t=db.transaction('m','readwrite');t.objectStore('m').put(blob,k);t.oncomplete=res;t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)});setURL(k,blob)}
async function mDel(k){try{const db=await idb();await new Promise(res=>{const t=db.transaction('m','readwrite');t.objectStore('m').delete(k);t.oncomplete=res;t.onerror=res})}catch(e){}
  if(mediaURL[k])URL.revokeObjectURL(mediaURL[k]);delete mediaURL[k];delete mediaType[k]}
async function mEach(fn){const db=await idb();await new Promise(res=>{const rq=db.transaction('m','readonly').objectStore('m').openCursor();rq.onsuccess=()=>{const c=rq.result;if(c){fn(c.key,c.value);c.continue()}else res()};rq.onerror=()=>res()})}
async function mLoadAll(){try{await mEach((k,b)=>setURL(k,b));if(Object.keys(mediaURL).length)render()}catch(e){}}
function compressPhoto(file){return new Promise((res,rej)=>{const img=new Image(),u=URL.createObjectURL(file);
  img.onload=()=>{const m=900,sc=Math.min(1,m/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=Math.round(img.width*sc);c.height=Math.round(img.height*sc);
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(u);c.toBlob(b=>b?res(b):rej(new Error('compression')),'image/jpeg',0.8)};
  img.onerror=()=>{URL.revokeObjectURL(u);rej(new Error('image illisible'))};img.src=u})}
async function handleMediaFile(file){
  const tg=ui.mediaTarget;ui.mediaTarget=null;if(!tg||!file)return;
  const k=tg.exId+'|'+tg.kind,isGif=file.type==='image/gif',isVid=file.type.startsWith('video/');
  try{
    let blob=file;
    if(tg.kind==='photo'&&!isGif&&!isVid)blob=await compressPhoto(file);
    if(blob.size>8*1024*1024)return toast('Fichier trop lourd (plus de 8 Mo) : prends un GIF plus court ou plus petit');
    await mPut(k,blob);ui.mview=ui.mview||{};ui.mview[tg.exId]=tg.kind;
    closeModal();render();toast(`${tg.kind==='photo'?'Photo':'Mouvement'} enregistré (${Math.max(1,Math.round(blob.size/1024))} ko)`);
  }catch(e){toast('Impossible d’enregistrer ce fichier sur ce navigateur')}
}

async function exportFull(){
  toast('Préparation de la sauvegarde…');
  const media={};
  try{const list=[];await mEach((k,b)=>list.push([k,b]));
    for(const [k,b] of list)media[k]=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(b)})}catch(e){}
  download(`carnet_complet_${todayISO()}.json`,JSON.stringify(Object.assign({},S,{media})),'application/json');
}
function dataURLtoBlob(u){const i=u.indexOf(','),head=u.slice(0,i),mime=(head.match(/data:([^;,]+)/)||[])[1]||'application/octet-stream',bin=atob(u.slice(i+1)),a=new Uint8Array(bin.length);for(let j=0;j<bin.length;j++)a[j]=bin.charCodeAt(j);return new Blob([a],{type:mime})}
async function exportMediaOnly(){
  const list=[];try{await mEach((k,b)=>list.push([k,b]))}catch(e){}
  const items=[];
  for(const [k,b] of list){const [id,kind]=k.split('|'),e=exById(id);if(!e)continue;
    items.push({name:e.name,kind,data:await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(b)})})}
  if(!items.length)return toast('Aucune photo ni GIF à exporter : ajoute-les d’abord dans l’onglet Exos');
  download(`carnet_photos_gif_${todayISO()}.json`,JSON.stringify({type:'carnet-media',v:1,items}),'application/json');
  toast(`${items.length} fichier${items.length>1?'s':''} exporté${items.length>1?'s':''}`);
}
async function importMediaOnly(d){
  const norm=s=>String(s||'').trim().toLowerCase();let ok=0;const miss=[];
  for(const it of d.items||[]){const e=S.exercises.find(x=>norm(x.name)===norm(it.name));
    if(!e||!['photo','gif'].includes(it.kind)){miss.push(it.name);continue}
    try{const b=dataURLtoBlob(it.data);await mPut(e.id+'|'+it.kind,b);ok++}catch(err){miss.push(it.name)}}
  render();
  ask(`${ok} photo${ok>1?'s':''} / GIF importé${ok>1?'s':''}`,miss.length?`Exos introuvables sur cet appareil (vérifie que le nom est identique) : ${[...new Set(miss)].join(', ')}.`:'Tout est en place. Tes séances n’ont pas été modifiées.',null,'OK');
}
async function importMedia(media){if(!media)return;for(const k of Object.keys(media)){try{const b=dataURLtoBlob(media[k]);await mPut(k,b)}catch(e){}}render()}
