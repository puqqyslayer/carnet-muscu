    <div><label class="f" for="sW">Poids visé (kg)</label><input id="sW" data-s="weightTarget" class="num" inputmode="decimal" value="${st.weightTarget}"></div>
    <div><label class="f" for="sN">Séances / semaine</label><input id="sN" data-s="weeklyTarget" class="num" inputmode="numeric" value="${st.weeklyTarget}"></div>
    <div><label class="f" for="sD">Début du suivi</label><input id="sD" data-s="startDate" type="date" value="${st.startDate}"></div></div>
    <label class="f">Jours prévus</label><div class="chips">${DAYS.map((d,i)=>`<button class="chip ${st.plannedDays.includes(i)?'on':''}" data-act="togDay" data-v="${i}">${d}</button>`).join('')}</div></div>
  <h2>Données</h2>
  <div class="box"><p class="muted small">Tout est stocké sur ce téléphone. Exporte régulièrement une sauvegarde ; les CSV (séparateur ;) s’ouvrent dans Excel ou pandas.</p>
    <div class="grid2" style="margin-top:8px"><button data-act="expSets">CSV séries</button><button data-act="expFood">CSV nutrition</button>
    <button data-act="expJson">Sauvegarde JSON</button><button data-act="impJson">Restaurer JSON</button>
    <button data-act="expFull" style="grid-column:span 2">Sauvegarde complète (avec photos et GIF)</button></div>
    <h3 style="margin-top:16px">Photos et GIF entre PC et iPhone</h3>
    <p class="muted small">Ajoute tes photos et GIF dans l’onglet Exos sur ton PC, exporte-les ici, puis importe le fichier sur ton iPhone. Seuls les photos et GIF sont ajoutés : tes séances ne sont pas touchées. Les exos sont reconnus par leur nom.</p>
    <div class="grid2" style="margin-top:8px"><button data-act="expMedia">Exporter photos et GIF</button><button data-act="impMedia">Importer photos et GIF</button></div>
    <input type="file" id="mediaImportFile" accept=".json,application/json" hidden>
    <button class="danger" style="width:100%;margin-top:10px" data-act="reset">Tout effacer</button></div>`;
}
function calcOut(){
  const box=document.getElementById('calcOut');if(!box)return;
  const c=ui.calc,w=num(c.w),r=num(c.r),ex=exById(c.exId),inc=ex?ex.inc:2.5;
  const t=num(c.target)||(ex?ex.repMin:8),rf=r+(DIFF_RESERVE[c.diff]??2);
  if(!w||!r||r<1||r>20){box.innerHTML='<p class="muted small">Renseigne un poids et un nombre de reps (1 à 20).</p>';return}
  const ep=w*(1+rf/30),bz=rf<37?w*36/(37-rf):ep,one=(ep+bz)/2;
  const work=t2=>roundDown(one/(1+(t2+2)/30),inc);
  const wT=work(t);
  box.innerHTML=`<div class="grid2"><div class="stat"><div class="kpi num">${fmt(Math.round(one))} kg</div><div class="muted small">max estimé (1 rep)</div></div>
    <div class="stat" style="outline:2px solid var(--blue)"><div class="kpi num">${fmt(wT)} kg</div><div class="muted small">pour ${t} reps en « Correct »</div></div></div>
    <div style="margin-top:10px">${[6,8,10,12,15].map(n=>`<div class="setrow num"><span>${n} reps</span><span>${fmt(work(n))} kg</span></div>`).join('')}</div>
    ${r>12?'<p class="muted small" style="margin-top:6px">Au-delà de 12 reps, l’estimation devient moins précise.</p>':''}
    ${ex?`<button class="primary" style="width:100%;margin-top:12px" data-act="applyCalc" data-v="${wT}">Utiliser ${fmt(wT)} kg à la prochaine séance de ${esc(ex.name)}</button>`:''}`;
}

/* ----- export / import ----- */
function download(name,text,mime){
  const blob=new Blob([text],{type:mime}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;
  document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1500);
}
const csvCell=v=>{const s=String(v??'');return /[;"\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s};
function expSets(){
  const rows=[['date','seance','exercice','muscles_principaux','muscles_secondaires','serie','poids_kg','reps','difficulte','execution','volume_kg','duree_seance_min','serie_test_echec','estimation_reps']];
  sortedSessions().forEach(s=>{const d=s.end&&s.start?Math.round((s.end-s.start)/60000):'';
    s.exos.forEach(e=>e.sets.forEach((x,i)=>rows.push([s.date,s.typeName||s.type,e.name,(e.primary||[]).join('|'),(e.secondary||[]).join('|'),i+1,x.w,x.r,x.diff,x.exec,x.w*x.r,d,x.test?1:0,x.est??''])))});
  download(`series_${todayISO()}.csv`,'\ufeff'+rows.map(r=>r.map(csvCell).join(';')).join('\n'),'text/csv');
}
function expFood(){
  const rows=[['date','kcal','poids_kg']];Object.keys(S.nutrition).sort().forEach(d=>{const e=S.nutrition[d];rows.push([d,e.kcal??'',e.bw??''])});
  download(`nutrition_${todayISO()}.csv`,'\ufeff'+rows.map(r=>r.map(csvCell).join(';')).join('\n'),'text/csv');
}

/* ========= confirmation intégrée ========= */
let pendingYes=null;
function ask(title,detail,onYes,yesLabel,danger){pendingYes=onYes;
  openModal(`<h2 style="margin-top:0">${esc(title)}</h2>${detail?`<p class="muted">${esc(detail)}</p>`:''}
  <button class="${danger?'danger':'primary'} big" data-act="askYes" style="margin-top:12px">${esc(yesLabel||'Confirmer')}</button>
  ${onYes?`<button class="ghost big" data-act="askNo" style="margin-top:8px">Annuler</button>`:''}`)}

/* ========= modal ========= */
function openModal(html){document.getElementById('sheet').innerHTML=html;document.getElementById('modal').classList.add('open')}
function closeModal(){document.getElementById('modal').classList.remove('open');ui.edit=null;ui.tpl=null;ui.sedit=null}
document.getElementById('modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal()});

/* ========= événements ========= */
function setNut(d,patch){const e=Object.assign({},S.nutrition[d]||{},patch);if(e.kcal==null&&e.bw==null)delete S.nutrition[d];else S.nutrition[d]=e;save()}
document.addEventListener('click',ev=>{
  const b=ev.target.closest('[data-act]');if(!b)return;
  const act=b.dataset.act,v=b.dataset.v,A=S.active;
  switch(act){
    case 'tab':ui.tab=v;ui.inSess=false;render();window.scrollTo(0,0);break;
    case 'homeType':ui.homeType=v;render();break;
    case 'start':startSession(v);break;
    case 'kadd':{const d=ui.tab==='food'?ui.nutDate:todayISO();const cur=(S.nutrition[d]||{}).kcal||0;setNut(d,{kcal:Math.max(0,cur+Number(v))});render();break}
    // séance
    case 'fab':if(S.active){ui.inSess=true;render();window.scrollTo(0,0)}else startSession(ui.homeType&&tplById(ui.homeType)?ui.homeType:nextType());break;
    case 'dw-':case 'dw+':{captureRows();const ex=curEx(),x=A.drafts[ex.id][Number(v)];x.w=Math.max(0,Math.round(((x.w||0)+(act==='dw+'?ex.inc:-ex.inc))*100)/100);render();break}
    case 'dr-':case 'dr+':{captureRows();const x=A.drafts[curEx().id][Number(v)];x.r=Math.max(0,(x.r||0)+(act==='dr+'?1:-1));render();break}
    case 'feel':captureRows();openModal(feelHTML(Number(v)));break;
    case 'feelDiff':case 'feelExec':{const[j,val]=v.split('|');A.drafts[curEx().id][Number(j)][act==='feelDiff'?'diff':'exec']=val;openModal(feelHTML(Number(j)));break}
    case 'valRow':validateRow(Number(v));break;
    case 'undoSet':{const ex=curEx(),arr=A.data[ex.id]||[],i=Number(v);if(i!==arr.length-1){toast('Seule la dernière série validée peut être annulée');break}
      ask(`Annuler la série ${i+1} ?`,'Elle repassera en « à faire » pour que tu puisses la corriger.',()=>{const x=arr.pop();A.drafts[ex.id].unshift({w:x.w,r:x.r,diff:x.test?'correct':x.diff,exec:x.exec});A.timerEnd=null;save();render()},'Annuler la série',true);break}
    case 'addRow':{captureRows();const ex=curEx(),dr=A.drafts[ex.id],l=dr[dr.length-1]||(A.data[ex.id]||[]).slice(-1)[0];dr.push({w:l?l.w:null,r:l?l.r:ex.repMin,diff:'correct',exec:'propre'});render();break}
    case 'testToggle':captureRows();A.form.test=!A.form.test;render();break;
    case 'mview':{const[id,k]=v.split('|');ui.mview=ui.mview||{};ui.mview[id]=k;render();break}
    case 'exMenu':if(S.active&&ui.inSess!==false)captureRows();openModal(exMenuHTML(v));break;
    case 'mediaPick':{const[id,k]=v.split('|');ui.mediaTarget={exId:id,kind:k};const inp=document.getElementById('mediaFile');inp.accept=k==='gif'?'image/gif,image/*,video/mp4,video/webm':'image/*';inp.click();break}
    case 'mediaDel':{const id=v.split('|')[0],inModal=document.getElementById('modal').classList.contains('open');mDel(v).then(()=>{render();if(inModal)openModal(exMenuHTML(id))});break}
    case 'expFull':exportFull();break;
    case 'toggleLegend':captureRows();S.settings.hideLegend=!S.settings.hideLegend;save();render();break;
    case 'editTips':if(S.active&&ui.inSess!==false)captureRows();openModal(tipsForm(v));setTimeout(()=>{const t=document.getElementById('tipsIn');if(t)t.focus()},50);break;
    case 'saveTips':{const e=exById(v);if(e){e.tips=document.getElementById('tipsIn').value.trim();save()}closeModal();render();toast('Conseils enregistrés');break}
    case 'openSess':closeModal();ui.tab='sess';ui.sessId=v;ui.inSess=false;render();window.scrollTo(0,0);break;
    case 'logF':ui.logF=v;render();break;
    case 'openExo':closeModal();ui.tab='exo';ui.exoId=v;ui.inSess=false;render();window.scrollTo(0,0);break;
    case 'libM':ui.libM=v;render();break;
    case 'restNow':{const ex=curEx();unlockAudio();startTimer(ex.rest,'Série suivante');save();render();break}
    case 'exProg':openModal(exProgHTML(v));break;
    case 'mapMode':ui.mapMode=v;render();break;
    case 'musTap':{const el=document.getElementById(b.dataset.t||'musInfo');if(el)el.textContent=b.dataset.i;break}
    case 'addPast':{const t=nextType()||(S.templates[0]&&S.templates[0].id);if(!t)return toast('Crée d’abord une séance');ui.sedit=newSessionDraft(t);openModal(seForm());break}
    case 'editSession':{const s=S.sessions.find(x=>x.id===v);if(s){ui.sedit=editDraft(s);openModal(seForm())}break}
    case 'seType':{captureSE();const d=ui.sedit,n=newSessionDraft(v);n.date=d.date;n.dur=d.dur;n.note=d.note;ui.sedit=n;reopenSE();break}
    case 'seRmEx':captureSE();ui.sedit.exos.splice(Number(v),1);reopenSE();break;
    case 'seAddSet':{captureSE();const e=ui.sedit.exos[Number(v)],l=e.sets[e.sets.length-1];e.sets.push(l?{w:l.w,r:l.r,diff:l.diff||'correct',exec:'propre'}:{w:'',r:'',diff:'correct',exec:'propre'});reopenSE();break}
    case 'seRmSet':{captureSE();const[a,c]=v.split('-').map(Number);ui.sedit.exos[a].sets.splice(c,1);reopenSE();break}
    case 'seSave':saveSE();break;
    case 'sessEdit':openModal(sessEditHTML());break;
    case 'sessAddEx':A.order.splice(A.idx+1,0,v);closeModal();save();render();toast('Exo ajouté juste après');break;
    case 'sessSwap':swapCurrent(v);closeModal();save();render();window.scrollTo(0,0);toast('Exo remplacé');break;
    case 'sessSwapNew':{const id=createFromAlt(Number(v));swapCurrent(id);closeModal();save();render();window.scrollTo(0,0);toast('Exo remplacé : trouve ta charge avec quelques séries légères');break}
    case 'sessRmEx':{const id=A.order[A.idx],done=(A.data[id]||[]).length;
      const go=()=>{A.order.splice(A.idx,1);delete A.data[id];A.timerEnd=null;if(A.idx>=A.order.length)A.finished=true;else initForm();closeModal();save();render();window.scrollTo(0,0)};
      if(done)ask('Retirer cet exo ?','Les séries déjà faites sur cet exo seront retirées.',go,'Retirer',true);else go();break}
    case 'askYes':{const f=pendingYes;pendingYes=null;closeModal();if(f)f();break}
    case 'askNo':pendingYes=null;closeModal();break;
    case 'quitEmpty':quitSession();break;
    case 'calcDiff':ui.calc.diff=v;render();break;
    case 'prevEx':if(A.idx>0){A.idx--;initForm();save();render()}break;
    case 'nextEx':if(A.idx<A.order.length-1){A.idx++;initForm()}else A.finished=true;A.timerEnd=null;save();render();window.scrollTo(0,0);break;
    case 'tAdd':A.timerEnd=Math.max(Date.now()+1000,A.timerEnd+Number(v)*1000);A.timerTotal=Math.max(A.timerTotal,Math.ceil((A.timerEnd-Date.now())/1000));save();render();break;
    case 'tSkip':if(A.timerKind==='stretch'&&A.stretchCur!=null&&!A.stretchDone.includes(A.stretchCur))A.stretchDone.push(A.stretchCur);A.timerEnd=null;save();render();break;
    case 'stretchGo':{const nEl=document.getElementById('sessNote');if(nEl)A.note=nEl.value;const x=stretchesFor(sessionMuscles(activeExos()))[Number(v)];if(!x)break;unlockAudio();A.stretchCur=Number(v);
      startTimer(x.sec,`${x.name}${x.sides?' · change de côté ensuite':''}`,'stretch');save();render();break}
    case 'sessMenu':openModal(`<h2 style="margin-top:0">Terminer la séance ?</h2><p class="muted">Tu peux l’enregistrer avec les séries déjà faites, ou l’abandonner sans rien garder.</p>
      <button class="primary big" data-act="goFinish" style="margin-top:10px">Terminer et enregistrer</button>
      <button class="danger big" data-act="abandon" style="margin-top:8px">Abandonner la séance</button>
      <button class="ghost big" data-act="closeModal" style="margin-top:8px">Continuer</button>`);break;
    case 'goFinish':closeModal();A.finished=true;A.timerEnd=null;save();render();window.scrollTo(0,0);break;
    case 'abandon':ask('Abandonner la séance ?','Rien ne sera enregistré.',quitSession,'Abandonner',true);break;
    case 'backToSession':A.finished=false;A.timerEnd=null;if(A.idx>=A.order.length)A.idx=A.order.length-1;initForm();save();render();break;
    case 'saveSession':saveSession();break;
    // récap / historique
    case 'recap':openRecap(v);break;
    case 'showStretch':openStretch(v);break;
    case 'delSession':ask('Supprimer cette séance ?','Elle sera retirée de l’historique et des courbes.',()=>{S.sessions=S.sessions.filter(s=>s.id!==v);recomputePRs();save();render()},'Supprimer',true);break;
    case 'closeModal':closeModal();if(S.active&&ui.inSess!==false)render();break;
    // calendrier
    case 'calPrev':ui.calMonth=new Date(ui.calMonth.getFullYear(),ui.calMonth.getMonth()-1,1);render();break;
    case 'calNext':ui.calMonth=new Date(ui.calMonth.getFullYear(),ui.calMonth.getMonth()+1,1);render();break;
    // créateur de séance
    case 'newTpl':{const used=S.templates.map(t=>t.color);ui.tpl={id:uid(),name:'',short:'',color:PALETTE.find(c=>!used.includes(c))||PALETTE[0],rotation:false,exIds:[]};openModal(tplForm());break}
    case 'editTpl':ui.tpl=JSON.parse(JSON.stringify(tplById(v)));openModal(tplForm());break;
    case 'tplColor':ui.tpl.color=v;reTpl();break;
    case 'tplRot':ui.tpl.rotation=!ui.tpl.rotation;reTpl();break;
    case 'tplAdd':ui.tpl.exIds.push(v);reTpl();break;
    case 'tplRm':{const ids=ui.tpl.exIds.filter(id=>exById(id));ids.splice(Number(v),1);ui.tpl.exIds=ids;reTpl();break}
    case 'tplUp':case 'tplDown':{const ids=ui.tpl.exIds.filter(id=>exById(id)),i=Number(v),j=act==='tplUp'?i-1:i+1;if(j>=0&&j<ids.length){[ids[i],ids[j]]=[ids[j],ids[i]]}ui.tpl.exIds=ids;reTpl();break}
    case 'saveTpl':saveTpl();break;
    case 'delTpl':{const id=ui.tpl.id;ask('Supprimer cette séance ?','Les exos et l’historique sont conservés.',()=>{S.templates=S.templates.filter(t=>t.id!==id);save();render()},'Supprimer',true);break}
    // exos
    case 'newEx':ui.edit={id:uid(),name:'',primary:[],secondary:[],sets:3,repMin:8,repMax:12,rest:90,inc:2.5,startWeight:null,forceW:null,notes:'',_tpls:[]};openModal(exForm());break;
    case 'editEx':{const e=JSON.parse(JSON.stringify(exById(v)));e._tpls=tplsOf(v).map(t=>t.id);ui.edit=e;openModal(exForm());break}
    case 'setProg':{document.querySelectorAll('#sheet [data-f]').forEach(i=>{ui.edit[i.dataset.f]=i.value});ui.edit.prog=v==='lin'?'lin':'double';
      const sc=document.getElementById('sheet').scrollTop;openModal(exForm());document.getElementById('sheet').scrollTop=sc;break}
    case 'togM':case 'togS':{document.querySelectorAll('#sheet [data-f]').forEach(i=>{ui.edit[i.dataset.f]=i.value});
      const k=act==='togS'?'_tpls':b.dataset.k,a=ui.edit[k],i=a.indexOf(v);if(i>=0)a.splice(i,1);else a.push(v);
      const sc=document.getElementById('sheet').scrollTop;openModal(exForm());document.getElementById('sheet').scrollTop=sc;break}
    case 'saveEx':saveEx();break;
    case 'delEx':{const id=ui.edit.id;ask('Supprimer cet exo ?','Son historique reste dans les séances passées.',()=>{mDel(id+'|photo');mDel(id+'|gif');S.exercises=S.exercises.filter(x=>x.id!==id);S.templates.forEach(t=>t.exIds=t.exIds.filter(x=>x!==id));save();render()},'Supprimer',true);break}
    // outils
    case 'applyCalc':{const ex=exById(ui.calc.exId);if(ex){ex.forceW=Number(v);save();toast(`${fmt(Number(v))} kg proposé à la prochaine séance`)}break}
    case 'togDay':{const i=Number(v),a=S.settings.plannedDays,j=a.indexOf(i);if(j>=0)a.splice(j,1);else a.push(i);a.sort();save();render();break}
    case 'expSets':expSets();break;
    case 'expFood':expFood();break;
    case 'expJson':download(`carnet_sauvegarde_${todayISO()}.json`,JSON.stringify(S,null,1),'application/json');break;
    case 'impJson':document.getElementById('importFile').click();break;
    case 'expMedia':toast('Préparation du fichier…');exportMediaOnly();break;
    case 'impMedia':document.getElementById('mediaImportFile').click();break;
    case 'reset':ask('Tout effacer ?','Séances, exos, nutrition : tout sera supprimé de ce téléphone. Fais une sauvegarde JSON avant si tu veux garder tes données.',()=>{S=defaults();migrate();save();render();toast('Données effacées')},'Tout effacer',true);break;
  }
});
document.addEventListener('input',ev=>{
  const t=ev.target;
  if(t.id==='libQ'){ui.libQ=t.value;const pos=t.selectionStart;render();const n=document.getElementById('libQ');if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(e){}}}
  if(ui.tab==='tools'&&!S.active){
    const map={cEx:'exId',cW:'w',cR:'r',cT:'target'};
    if(map[t.id]){ui.calc[map[t.id]]=t.value;if(t.id==='cEx'){const ex=exById(t.value);if(ex){ui.calc.target=String(ex.repMin);const T=document.getElementById('cT');if(T)T.value=ex.repMin}}calcOut()}
  }
  if(S.active&&!S.active.finished&&ui.inSess!==false&&(t.dataset.dw!=null||t.dataset.dr!=null||t.id==='fest'))captureRows();
  if(S.active&&t.id==='sessNote')S.active.note=t.value;
});
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='mediaFile'&&t.files[0]){handleMediaFile(t.files[0]);t.value=''}
  if(t.id==='nutDate'){ui.nutDate=t.value||todayISO();render()}
  if(t.id==='se-add'&&t.value&&ui.sedit){captureSE();const e=exById(t.value);if(e)ui.sedit.exos.push({exId:e.id,name:e.name,primary:e.primary.slice(),secondary:e.secondary.slice(),sets:emptySets(e)});reopenSE()}
  if(t.id==='kcalIn'){setNut(ui.nutDate,{kcal:num(t.value)==null?null:Math.round(num(t.value))});render()}
  if(t.id==='bwIn'){setNut(ui.nutDate,{bw:num(t.value)});render()}
  if(t.dataset&&t.dataset.s){const k=t.dataset.s;S.settings[k]=k==='startDate'?(t.value||todayISO()):(num(t.value)||S.settings[k]);save();toast('Réglage enregistré')}
  if(t.id==='mediaImportFile'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);
      if(d.type==='carnet-media')importMediaOnly(d);
      else if(d.media&&d.exercises){const items=[];Object.keys(d.media).forEach(k=>{const[id,kind]=k.split('|'),e=d.exercises.find(x=>x.id===id);if(e)items.push({name:e.name,kind,data:d.media[k]})});importMediaOnly({items})}
      else throw 0}catch(e){toast('Fichier invalide : choisis un export « photos et GIF »')}t.value=''};r.readAsText(t.files[0])}
  if(t.id==='importFile'&&t.files[0]){const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!d.exercises||!d.sessions)throw 0;const media=d.media;delete d.media;
    ask('Restaurer cette sauvegarde ?','Toutes les données actuelles seront remplacées.',()=>{S=mergeData(d);recomputePRs();save();render();importMedia(media);toast('Sauvegarde restaurée')},'Restaurer',true)}
    catch(e){toast('Fichier invalide : choisis un JSON exporté depuis le carnet')}t.value=''};r.readAsText(t.files[0])}
});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.active)render()});

ui.inSess=true;render();mLoadAll();
if('serviceWorker' in navigator&&location.protocol.startsWith('http')){navigator.serviceWorker.register('sw.js').catch(()=>{})}
